<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>占い台帳・結果</title><style>html,body{margin:0;height:100%;background:#f5f5f7}iframe{display:block;width:100%;height:100vh;border:0}</style></head><body><iframe id="core" title="占い結果"></iframe><script>const f=document.getElementById('core');f.src='result-core.html'+location.search;f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;d.querySelectorAll('a').forEach(a=>a.target='_top');const fromSearch=/\/search-all\.html(?:[?#]|$)/.test(document.referrer||'');if(fromSearch){const t=d.getElementById('topBack'),b=d.getElementById('bottomBack');if(t){t.textContent='← 全期間検索へ戻る';t.href='search-all.html?v=20260922-verdict2';t.onclick=null}if(b){b.textContent='全期間検索へ戻る';b.href='search-all.html?v=20260922-verdict2';b.onclick=null}}const p=new URLSearchParams(location.search),seq=p.get('seq');let logs=[];try{logs=JSON.parse(localStorage.getItem('uranai-ledger-v1'))||[]}catch(e){}const item=logs.find(x=>String(x.seq)===String(seq));const card=d.querySelector('#result .card');if(!item||!card||card.querySelector('.resultDeleteBtn'))return;const btn=d.createElement('button');btn.type='button';btn.className='resultDeleteBtn';btn.textContent='この占いを削除';btn.style.cssText='width:100%;box-sizing:border-box;margin-top:12px;padding:11px 14px;border:1px solid #b44;border-radius:12px;background:transparent;color:inherit;font-weight:800;cursor:pointer';btn.onclick=()=>{if(!confirm(`通算 #${item.seq} を削除する？`))return;logs=logs.filter(x=>String(x.id)!==String(item.id));localStorage.setItem('uranai-ledger-v1',JSON.stringify(logs));top.location.href='./?return=1'};const back=d.getElementById('bottomBack');if(back)card.insertBefore(btn,back);else card.appendChild(btn)});</script></body></html>
