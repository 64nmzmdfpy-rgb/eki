<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>占い台帳・結果</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}body{margin:0;background:#f5f5f7;color:#111}main{max-width:760px;margin:auto;padding:16px}.panel,.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}.card{position:relative;padding-right:52px}.muted{opacity:.72}.q{font-weight:700;font-size:18px;margin:8px 0}.v{font-weight:800;margin-top:10px}.leoRead{white-space:pre-wrap;margin-top:14px;border-top:1px solid #ddd;padding-top:14px;line-height:1.6}a{color:inherit}.btn{display:block;text-align:center;text-decoration:none;border:1px solid #bbb;border-radius:12px;padding:11px 14px;margin-top:12px}.star{position:absolute;top:10px;right:10px;width:auto;border:0;background:transparent;font-size:24px;padding:4px 6px;line-height:1;cursor:pointer}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.panel,.card{background:#1c1c1e;border-color:#38383a}.btn{border-color:#555}.star{background:transparent;color:#fff}.leoRead{border-color:#38383a}}
</style>
</head>
<body><main>
<section class="panel"><b>占い結果</b><p><a id="topBack" href="search-all.html?v=20260917-4">← 全期間検索へ戻る</a></p></section>
<div id="result"></div>
<script>
const KEY='uranai-ledger-v1';let logs=[];try{logs=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(logs))}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function parseLeoVerdict(text){const t=String(text||'');const exact=[...t.matchAll(/最終判定\s*[：:]\s*(YES|NO|中立)/gi)].pop();if(exact){const v=exact[1].toUpperCase();return v==='YES'?'YES':v==='NO'?'NO':'中立'}const tail=t.slice(-1600);const pats=[/(?:結論|最終|判定)[^。\n]{0,40}(YES|NO|中立)/gi,/(YES|NO|中立)\s*寄り/gi];for(const re of pats){const all=[...tail.matchAll(re)];if(all.length){const v=all[all.length-1][1].toUpperCase();return v==='YES'?'YES':v==='NO'?'NO':'中立'}}return ''}
function createdDate(x){if(x.createdAt){const d=new Date(x.createdAt);if(!Number.isNaN(d.getTime()))return d}const m=String(x.id||'').match(/^L(\d{13})$/);if(!m)return null;const d=new Date(Number(m[1]));if(Number.isNaN(d.getTime()))return null;const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(x.date&&x.date!==k)return null;x.createdAt=d.toISOString();save();return d}
function timeText(x){const d=createdDate(x);return d?`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'時刻不明'}
const params=new URLSearchParams(location.search),seq=params.get('seq'),from=params.get('from');const item=logs.find(x=>String(x.seq)===String(seq));const box=document.getElementById('result');
const cameFromSearch=/\/search-all\.html(?:[?#]|$)/.test(document.referrer||'');
const topBack=document.getElementById('topBack');
if(from==='index'){topBack.textContent='← 本番台帳へ戻る';topBack.href='./?return=1'}else if(cameFromSearch){topBack.onclick=ev=>{ev.preventDefault();history.back()}}
if(!item){box.innerHTML='<section class="card">この端末の台帳に該当する占いが見つかりません。</section>'}else{const formal=item.formalVerdict||parseLeoVerdict(item.leoRead)||'未設定',backLabel=from==='index'?'本番台帳へ戻る':cameFromSearch?'全期間検索へ戻る':'本番台帳へ戻る';box.innerHTML=`<section class="card"><button class="star" title="${item.important?'重要を解除':'重要にする'}" aria-label="${item.important?'重要を解除':'重要にする'}">${item.important?'★':'☆'}</button><div class="muted">${esc(item.date||'日付不明')} ／ ${esc(timeText(item))} ／ 通算 #${esc(item.seq||'')}</div><div class="q">${esc(item.q||'')}</div><div class="muted">生データ：${esc(item.raw||'')}<br>本卦：${esc(item.ben||'')}<br>変爻：${esc(item.move||'')}<br>之卦：${esc(item.zhi||'')}</div><div style="margin-top:10px">${esc(item.summary||'')}</div><div class="v">簡易判定：${esc(item.verdict||'未判定')}</div><div class="v">正式判定：${esc(formal)}</div>${item.leoRead?`<div class="leoRead"><b>レオの読み</b><div style="margin-top:8px">${esc(item.leoRead)}</div></div>`:''}${item.memo?`<div class="muted" style="margin-top:14px">メモ：${esc(item.memo)}</div>`:''}<a id="bottomBack" class="btn" href="${from==='index'?'./?return=1':'./'}">${backLabel}</a></section>`;box.querySelector('.star').onclick=()=>{item.important=!item.important;save();location.reload()};const bottomBack=document.getElementById('bottomBack');if(cameFromSearch&&from!=='index'){bottomBack.href='search-all.html?v=20260917-4';bottomBack.onclick=ev=>{ev.preventDefault();history.back()}}}
</script></main></body></html>
