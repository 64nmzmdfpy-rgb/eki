<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>占い台帳・全期間検索</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}body{margin:0;background:#f5f5f7;color:#111}main{max-width:760px;margin:auto;padding:16px}.panel,.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}.card{position:relative;padding-right:52px}input,select,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px}button{background:#fff;color:#111;cursor:pointer}.muted{opacity:.7}.q{font-weight:700;font-size:17px;margin:6px 0}.meta{font-size:13px;font-weight:700;opacity:.7}.v{font-weight:700;margin-top:8px}a{color:inherit}.open{display:block;text-align:center;text-decoration:none;border:1px solid #bbb;border-radius:12px;padding:10px 12px;margin-top:12px;font-weight:700}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.stat{border:1px solid #ddd;border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}.deadline{font-weight:700;margin-top:8px}.warn{border:1px solid #b66;border-radius:12px;padding:10px;margin-top:10px;font-weight:700}.small{font-size:13px}.dupes{margin-top:10px}.dupes a{display:block;margin-top:6px}.star{position:absolute;top:10px;right:10px;width:auto;border:0;background:transparent;font-size:24px;padding:4px 6px;line-height:1}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.panel,.card{background:#1c1c1e;border-color:#38383a}input,select,button{background:#111;color:#fff;border-color:#444}.open,.stat{border-color:#555}.star{background:transparent;border:0}}
</style>
</head>
<body><main>
<section class="panel"><b>全期間検索</b><p class="muted">台帳に保存されている全日付を横断して検索します。データはこの端末のブラウザ内だけで扱います。</p><div id="overdue"></div><input id="search" placeholder="質問・判定・メモなどを検索"><div class="filters"><select id="grade"><option value="">答え合わせ：すべて</option><option>未判定</option><option>当たり</option><option>ハズレ</option></select><select id="formal"><option value="">正式判定：すべて</option><option>YES</option><option>NO</option><option>中立</option><option>未設定</option></select><select id="deadline"><option value="">期限：すべて</option><option value="pending-with-date">期限設定あり＋未判定</option><option value="with-date">期限設定あり</option><option value="overdue">期限切れ＋未判定</option></select><select id="important"><option value="">重要：すべて</option><option value="yes">重要のみ</option></select><select id="sort"><option value="seq-desc">並び順：新しい順</option><option value="seq-asc">古い順</option><option value="deadline-asc">期限が近い順</option></select></div><div id="stats" class="stats"></div><div id="summary" class="muted" style="margin-top:8px"></div><div id="backupInfo" class="muted small" style="margin-top:8px"></div><p><a href="./">← 本番台帳へ戻る</a></p></section>
<section class="panel"><b>質問の重複チェック</b><p class="muted small">意味の一致までは判定せず、完全一致と軽い表記ゆれだけ確認します。</p><input id="dupeInput" placeholder="確認したい質問を入力"><div id="dupeInfo" class="dupes muted"></div></section>
<div id="results"></div>
<script>
const KEY='uranai-ledger-v1',BACKUPKEY='uranai-ledger-last-backup-v1';let logs=[];try{logs=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(logs))}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function parseLeoVerdict(text){const t=String(text||'');const exact=[...t.matchAll(/最終判定\s*[：:]\s*(YES|NO|中立)/gi)].pop();if(exact){const v=exact[1].toUpperCase();return v==='YES'?'YES':v==='NO'?'NO':'中立'}const tail=t.slice(-1600);const pats=[/(?:結論|最終|判定)[^。\n]{0,40}(YES|NO|中立)/gi,/(YES|NO|中立)\s*寄り/gi];for(const re of pats){const all=[...tail.matchAll(re)];if(all.length){const v=all[all.length-1][1].toUpperCase();return v==='YES'?'YES':v==='NO'?'NO':'中立'}}return ''}
function formalOf(x){return x.formalVerdict||parseLeoVerdict(x.leoRead)||'未設定'}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function accuracy(arr){const hit=arr.filter(x=>(x.grade||'未判定')==='当たり').length,miss=arr.filter(x=>(x.grade||'未判定')==='ハズレ').length,n=hit+miss;return n?`${Math.round(hit/n*1000)/10}% (${hit}/${n})`:'—'}
function renderStats(){const hit=logs.filter(x=>(x.grade||'未判定')==='当たり').length,miss=logs.filter(x=>(x.grade||'未判定')==='ハズレ').length,pending=logs.filter(x=>(x.grade||'未判定')==='未判定').length;document.getElementById('stats').innerHTML=`<div class="stat"><span class="muted">全件</span><b>${logs.length}</b></div><div class="stat"><span class="muted">未判定</span><b>${pending}</b></div><div class="stat"><span class="muted">当たり / ハズレ</span><b>${hit} / ${miss}</b></div><div class="stat"><span class="muted">全体的中率</span><b>${accuracy(logs)}</b></div><div class="stat"><span class="muted">正式 YES</span><b>${accuracy(logs.filter(x=>formalOf(x)==='YES'))}</b></div><div class="stat"><span class="muted">正式 NO</span><b>${accuracy(logs.filter(x=>formalOf(x)==='NO'))}</b></div><div class="stat"><span class="muted">正式 中立</span><b>${accuracy(logs.filter(x=>formalOf(x)==='中立'))}</b></div><div class="stat"><span class="muted">重要</span><b>${logs.filter(x=>x.important).length}</b></div>`}
function renderTop(){const overdue=logs.filter(x=>x.check&&(x.grade||'未判定')==='未判定'&&x.check<todayKey()).length;document.getElementById('overdue').innerHTML=overdue?`<div class="warn">期限切れで未判定：${overdue}件</div>`:'';const s=localStorage.getItem(BACKUPKEY);document.getElementById('backupInfo').textContent=s?`最終バックアップ記録：${new Date(s).toLocaleString()}`:'最終バックアップ記録：まだありません'}
function normalizeQ(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s　。、！？!?.,・「」『』（）()［\][\]{}【】<>＜＞:：;；'"’”“`]/g,'')}
function renderDupe(){const raw=document.getElementById('dupeInput').value.trim(),box=document.getElementById('dupeInfo');if(!raw){box.textContent='';return}const n=normalizeQ(raw),exact=logs.filter(x=>String(x.q||'').trim()===raw),near=logs.filter(x=>String(x.q||'').trim()!==raw&&normalizeQ(x.q)===n);const arr=[...exact,...near];if(!arr.length){box.textContent='同文・軽い表記ゆれ一致は見つかりません';return}box.innerHTML=`${arr.length}件見つかりました`+arr.sort((a,b)=>Number(b.seq||0)-Number(a.seq||0)).map(x=>`<a href="result.html?seq=${encodeURIComponent(x.seq||'')}">通算 #${esc(x.seq||'')} ／ ${esc(x.date||'日付不明')}</a>`).join('')}
function render(){const term=document.getElementById('search').value.trim().toLowerCase(),gf=document.getElementById('grade').value,ff=document.getElementById('formal').value,df=document.getElementById('deadline').value,imp=document.getElementById('important').value,sort=document.getElementById('sort').value;let arr=[...logs];if(term)arr=arr.filter(x=>JSON.stringify(x).toLowerCase().includes(term));if(gf)arr=arr.filter(x=>(x.grade||'未判定')===gf);if(ff)arr=arr.filter(x=>formalOf(x)===ff);if(df==='pending-with-date')arr=arr.filter(x=>x.check&&(x.grade||'未判定')==='未判定');if(df==='with-date')arr=arr.filter(x=>x.check);if(df==='overdue')arr=arr.filter(x=>x.check&&(x.grade||'未判定')==='未判定'&&x.check<todayKey());if(imp==='yes')arr=arr.filter(x=>x.important);if(sort==='seq-asc')arr.sort((a,b)=>Number(a.seq||0)-Number(b.seq||0));else if(sort==='deadline-asc')arr.sort((a,b)=>(a.check||'9999-12-31').localeCompare(b.check||'9999-12-31')||Number(a.seq||0)-Number(b.seq||0));else arr.sort((a,b)=>Number(b.seq||0)-Number(a.seq||0));const box=document.getElementById('results');box.innerHTML='';document.getElementById('summary').textContent=`${arr.length}件表示／全${logs.length}件`;arr.forEach(item=>{const formal=formalOf(item),grade=item.grade||'未判定';const e=document.createElement('div');e.className='card';e.innerHTML=`<button class="star" title="${item.important?'重要を解除':'重要にする'}" aria-label="${item.important?'重要を解除':'重要にする'}">${item.important?'★':'☆'}</button><div class="meta">${esc(item.date||'日付不明')} ／ 通算 #${esc(item.seq||'')}</div><div class="q">${esc(item.q||'')}</div><div class="muted">本卦：${esc(item.ben||'')}<br>変爻：${esc(item.move||'')}<br>之卦：${esc(item.zhi||'')}</div><div class="v">簡易判定：${esc(item.verdict||'未判定')}</div><div class="v">正式判定：${esc(formal)}</div><div class="v">答え合わせ：${esc(grade)}</div>${item.check?`<div class="deadline">答え合わせ予定日：${esc(item.check)}</div>`:''}${item.memo?`<div class="muted" style="margin-top:8px">メモ：${esc(item.memo)}</div>`:''}<a class="open" href="result.html?seq=${encodeURIComponent(item.seq||'')}">この占いを開く</a>`;e.querySelector('.star').onclick=()=>{item.important=!item.important;save();renderStats();render()};box.append(e)})}
['search','grade','formal','deadline','important','sort'].forEach(id=>document.getElementById(id).oninput=render);document.getElementById('dupeInput').oninput=renderDupe;renderTop();renderStats();render();
</script></main></body></html>
