<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>占い台帳・全期間検索</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}body{margin:0;background:#f5f5f7;color:#111}main{max-width:760px;margin:auto;padding:16px}.panel,.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}.card{position:relative;padding-right:52px}input,select,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px}button{background:#fff;color:#111;cursor:pointer}.muted{opacity:.7}.small{font-size:13px}.qrow{display:flex;align-items:flex-start;gap:6px;margin:6px 0}.q{font-weight:700;font-size:17px;flex:1;min-width:0}.copyq{width:auto;flex:0 0 auto;padding:3px 7px;border-radius:8px;font-size:11px;line-height:1.4;opacity:.72}.meta{font-size:13px;font-weight:700;opacity:.7}.v{font-weight:700;margin-top:8px}a{color:inherit}.open{display:block;text-align:center;text-decoration:none;border:1px solid #bbb;border-radius:12px;padding:10px 12px;margin-top:12px;font-weight:700}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.stat{border:1px solid #ddd;border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}.deadline{font-weight:700;margin-top:8px}.warn{border:1px solid #b66;border-radius:12px;padding:10px;margin-top:10px;font-weight:700}.dupes{margin-top:10px}.dupes a{display:block;margin-top:6px}.star{position:absolute;top:10px;right:10px;width:auto;border:0;background:transparent;font-size:24px;padding:4px 6px;line-height:1}.timegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.timebox{border:1px solid #ddd;border-radius:12px;padding:10px}.timebox b{display:block;font-size:18px;margin:4px 0}.tagrow{margin-top:5px}.taglabel{font-size:11px;font-weight:700;opacity:.62;margin-right:4px}.chip{display:inline-block;border:1px solid #bbb;border-radius:999px;padding:3px 7px;margin:2px;font-size:11px;text-decoration:none;color:inherit;cursor:pointer}.rankrow{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid rgba(127,127,127,.22)}.tagfilter{border:1px solid #bbb;border-radius:12px;padding:9px 11px;margin-top:8px;font-weight:700}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.panel,.card{background:#1c1c1e;border-color:#38383a}input,select,button{background:#111;color:#fff;border-color:#444}.open,.stat,.timebox,.chip,.tagfilter{border-color:#555}.star{background:transparent;border:0}.copyq{background:#2c2c2e}}
</style>
</head>
<body><main>
<section class="panel"><b>全期間検索</b><p class="muted">質問文・判定・メモ・保存タグをまとめて検索します。</p><div id="overdue"></div><input id="search" placeholder="質問・人物・作品・テーマ・指標などを検索"><div id="activeTag"></div><div class="filters"><select id="grade"><option value="">答え合わせ：すべて</option><option>未判定</option><option>当たり</option><option>ハズレ</option></select><select id="formal"><option value="">正式判定：すべて</option><option>YES</option><option>NO</option><option>中立</option><option>未設定</option></select><select id="deadline"><option value="">期限：すべて</option><option value="pending-with-date">期限設定あり＋未判定</option><option value="with-date">期限設定あり</option><option value="overdue">期限切れ＋未判定</option></select><select id="important"><option value="">お気に入り：すべて</option><option value="yes">お気に入りのみ</option></select><select id="sort"><option value="deadline-asc" selected>並び順：期限が近い順</option><option value="seq-desc">新しい順</option><option value="seq-asc">古い順</option></select></div><div id="stats" class="stats"></div><div id="summary" class="muted" style="margin-top:8px"></div><div id="backupInfo" class="muted small" style="margin-top:8px"></div><p><a href="./">← 本番台帳へ戻る</a></p></section>
<section class="panel"><b>時間帯別の的中率</b><p class="muted small">時刻が復元できるログだけを集計します。</p><div id="timeStats" class="timegrid"></div><div id="timeNote" class="muted small" style="margin-top:8px"></div></section>
<section class="panel"><b>タグランキング</b><div class="muted small">実データの entities を集計。文字列から人物名を推測しません。</div><div id="entityAnalytics"></div></section>
<section class="panel"><b>質問の重複チェック</b><p class="muted small">完全一致と軽い表記ゆれだけ確認します。</p><input id="dupeInput" placeholder="確認したい質問を入力"><div id="dupeInfo" class="dupes muted"></div></section>
<div id="results"></div>
<script>
const KEY='uranai-ledger-v1',BACKUPKEY='uranai-ledger-last-backup-v1';let logs=[];try{logs=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const tagParam=new URLSearchParams(location.search).get('tag')||'';
function save(){localStorage.setItem(KEY,JSON.stringify(logs))}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}}
function parseLeoVerdict(text){const t=String(text||'');const exact=[...t.matchAll(/最終判定\s*[：:]\s*(YES|NO|中立)/gi)].pop();if(exact){const v=exact[1].toUpperCase();return v==='YES'?'YES':v==='NO'?'NO':'中立'}const tail=t.slice(-2000);const pats=[/(?:結論|最終|判定)[^。\n]{0,50}(YES|NO|中立)/gi,/(YES|NO|中立)\s*寄り/gi];for(const re of pats){const all=[...tail.matchAll(re)];if(all.length){const v=all[all.length-1][1].toUpperCase();return v==='YES'?'YES':v==='NO'?'NO':'中立'}}return''}
function formalOf(x){return x.formalVerdict||parseLeoVerdict(x.leoRead)||'未設定'}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function accuracy(arr){const hit=arr.filter(x=>(x.grade||'未判定')==='当たり').length,miss=arr.filter(x=>(x.grade||'未判定')==='ハズレ').length,n=hit+miss;return n?`${Math.round(hit/n*1000)/10}% (${hit}/${n})`:'—'}
function entitiesOf(x){const e=x&&x.entities||{};return{person:Array.isArray(e.person)?e.person:[],work:Array.isArray(e.work)?e.work:[],organization:Array.isArray(e.organization)?e.organization:[],topic:Array.isArray(e.topic)?e.topic:[],metric:Array.isArray(e.metric)?e.metric:[]}}
function hasExactTag(x,tag){if(!tag)return true;return Object.values(entitiesOf(x)).some(a=>a.includes(tag))}
function tagUrl(v){return `search-all.html?tag=${encodeURIComponent(v)}&v=20260918-tagclick`}
function tagBlock(x){const e=entitiesOf(x),defs=[['person','人物'],['work','作品'],['organization','組織'],['topic','テーマ'],['metric','指標']],rows=[];for(const [k,label] of defs){if(!e[k].length)continue;rows.push(`<div class="tagrow"><span class="taglabel">${label}</span>${e[k].map(v=>`<a class="chip" href="${tagUrl(v)}">${esc(v)}</a>`).join('')}</div>`)}return rows.join('')}
function renderStats(){const hit=logs.filter(x=>(x.grade||'未判定')==='当たり').length,miss=logs.filter(x=>(x.grade||'未判定')==='ハズレ').length,pending=logs.filter(x=>(x.grade||'未判定')==='未判定').length,tagged=logs.filter(x=>Object.values(entitiesOf(x)).some(a=>a.length)).length;document.getElementById('stats').innerHTML=`<div class="stat"><span class="muted">全件</span><b>${logs.length}</b></div><div class="stat"><span class="muted">タグあり</span><b>${tagged}</b></div><div class="stat"><span class="muted">未判定</span><b>${pending}</b></div><div class="stat"><span class="muted">当たり / ハズレ</span><b>${hit} / ${miss}</b></div><div class="stat"><span class="muted">全体的中率</span><b>${accuracy(logs)}</b></div><div class="stat"><span class="muted">お気に入り</span><b>${logs.filter(x=>x.important).length}</b></div>`}
function recoverDate(x){const m=String(x.id||'').match(/^L(\d{13})$/);if(!m)return null;const d=new Date(Number(m[1]));if(Number.isNaN(d.getTime()))return null;return d}
function createdDate(x){if(x.createdAt){const d=new Date(x.createdAt);if(!Number.isNaN(d.getTime()))return d}return recoverDate(x)}
function timeText(x){const d=createdDate(x);return d?`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'時刻不明'}
function renderTimeStats(){const bands=[{label:'0–5時',from:0,to:5},{label:'6–11時',from:6,to:11},{label:'12–17時',from:12,to:17},{label:'18–23時',from:18,to:23}],known=logs.map(x=>({x,d:createdDate(x)})).filter(v=>v.d);document.getElementById('timeStats').innerHTML=bands.map(b=>{const arr=known.filter(v=>{const h=v.d.getHours();return h>=b.from&&h<=b.to}).map(v=>v.x),hit=arr.filter(x=>(x.grade||'未判定')==='当たり').length,miss=arr.filter(x=>(x.grade||'未判定')==='ハズレ').length,judged=hit+miss,rate=judged?`${Math.round(hit/judged*1000)/10}%`:'—';return `<div class="timebox"><span>${b.label}</span><b>${rate}</b><div class="small">全${arr.length}件 ／ 当たり${hit}・ハズレ${miss}</div></div>`}).join('');document.getElementById('timeNote').textContent=`時刻あり ${known.length}件 ／ 時刻不明 ${logs.length-known.length}件。`}
function rankHtml(map){const a=[...map.entries()].map(([name,n])=>({name,n})).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name,'ja')).slice(0,15);return a.length?a.map((x,i)=>`<div class="rankrow"><b>${i+1}</b><a href="${tagUrl(x.name)}">${esc(x.name)}</a><b>${x.n}件</b></div>`).join(''):'タグなし'}
function renderEntityAnalytics(){const defs=[['person','人物'],['work','作品'],['organization','組織'],['topic','テーマ'],['metric','指標']];document.getElementById('entityAnalytics').innerHTML=defs.map(([k,label])=>{const m=new Map();for(const x of logs)for(const v of entitiesOf(x)[k])m.set(v,(m.get(v)||0)+1);return `<details style="margin-top:12px"><summary style="font-weight:700;cursor:pointer">${label}ランキング</summary><div style="margin-top:6px">${rankHtml(m)}</div></details>`}).join('')}
function normalizeQ(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s　。、！？!?.,・「」『』（）()［\][\]{}【】<>＜＞:：;；'"’”“`]/g,'')}
function renderDupe(){const raw=document.getElementById('dupeInput').value.trim(),box=document.getElementById('dupeInfo');if(!raw){box.textContent='';return}const n=normalizeQ(raw),arr=logs.filter(x=>normalizeQ(x.q)===n);if(!arr.length){box.textContent='同文・軽い表記ゆれ一致は見つかりません';return}box.innerHTML=`${arr.length}件見つかりました`+arr.sort((a,b)=>Number(b.seq||0)-Number(a.seq||0)).map(x=>`<a href="result.html?seq=${encodeURIComponent(x.seq||'')}">通算 #${esc(x.seq||'')} ／ ${esc(x.date||'日付不明')}</a>`).join('')}
function renderTop(){const overdue=logs.filter(x=>x.check&&(x.grade||'未判定')==='未判定'&&x.check<todayKey()).length;document.getElementById('overdue').innerHTML=overdue?`<div class="warn">期限切れで未判定：${overdue}件</div>`:'';const s=localStorage.getItem(BACKUPKEY);document.getElementById('backupInfo').textContent=s?`最終バックアップ記録：${new Date(s).toLocaleString()}`:'最終バックアップ記録：まだありません';document.getElementById('activeTag').innerHTML=tagParam?`<div class="tagfilter">タグ：${esc(tagParam)} <a href="search-all.html?v=20260918-tagclick" style="float:right">解除</a></div>`:''}
function searchable(x){return JSON.stringify({q:x.q,verdict:x.verdict,formalVerdict:formalOf(x),memo:x.memo,summary:x.summary,entities:x.entities}).toLowerCase()}
function render(){const term=document.getElementById('search').value.trim().toLowerCase(),gf=document.getElementById('grade').value,ff=document.getElementById('formal').value,df=document.getElementById('deadline').value,imp=document.getElementById('important').value,sort=document.getElementById('sort').value;let arr=[...logs];if(tagParam)arr=arr.filter(x=>hasExactTag(x,tagParam));if(term)arr=arr.filter(x=>searchable(x).includes(term));if(gf)arr=arr.filter(x=>(x.grade||'未判定')===gf);if(ff)arr=arr.filter(x=>formalOf(x)===ff);if(df==='pending-with-date')arr=arr.filter(x=>x.check&&(x.grade||'未判定')==='未判定');if(df==='with-date')arr=arr.filter(x=>x.check);if(df==='overdue')arr=arr.filter(x=>x.check&&(x.grade||'未判定')==='未判定'&&x.check<todayKey());if(imp==='yes')arr=arr.filter(x=>x.important);if(sort==='seq-asc')arr.sort((a,b)=>Number(a.seq||0)-Number(b.seq||0));else if(sort==='deadline-asc')arr.sort((a,b)=>(a.check||'9999-12-31').localeCompare(b.check||'9999-12-31')||Number(a.seq||0)-Number(b.seq||0));else arr.sort((a,b)=>Number(b.seq||0)-Number(a.seq||0));const box=document.getElementById('results');box.innerHTML='';document.getElementById('summary').textContent=`${arr.length}件表示／全${logs.length}件${tagParam?` ／ タグ「${tagParam}」`:''}`;for(const item of arr){const formal=formalOf(item),grade=item.grade||'未判定',e=document.createElement('div');e.className='card';e.innerHTML=`<button class="star" title="${item.important?'お気に入りを解除':'お気に入りにする'}">${item.important?'★':'☆'}</button><div class="meta">${esc(item.date||'日付不明')} ／ ${esc(timeText(item))} ／ 通算 #${esc(item.seq||'')}</div><div class="qrow"><div class="q">${esc(item.q||'')}</div><button class="copyq" type="button">コピー</button></div>${tagBlock(item)}<div class="muted" style="margin-top:8px">本卦：${esc(item.ben||'')}<br>変爻：${esc(item.move||'')}<br>之卦：${esc(item.zhi||'')}</div><div class="v">簡易判定：${esc(item.verdict||'未判定')}</div><div class="v">正式判定：${esc(formal)}</div><div class="v">答え合わせ：${esc(grade)}</div>${item.check?`<div class="deadline">答え合わせ予定日：${esc(item.check)}</div>`:''}${item.memo?`<div class="muted" style="margin-top:8px">メモ：${esc(item.memo)}</div>`:''}<a class="open" href="result.html?seq=${encodeURIComponent(item.seq||'')}">この占いを開く</a>`;e.querySelector('.star').onclick=()=>{item.important=!item.important;save();renderStats();render()};e.querySelector('.copyq').onclick=async ev=>{const b=ev.currentTarget,ok=await copyText(item.q||'');b.textContent=ok?'済':'失敗';setTimeout(()=>b.textContent='コピー',1200)};box.append(e)}}
['search','grade','formal','deadline','important','sort'].forEach(id=>document.getElementById(id).oninput=render);document.getElementById('dupeInput').oninput=renderDupe;renderTop();renderStats();renderTimeStats();renderEntityAnalytics();render();
</script></main></body></html>
