<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>占い台帳・全期間検索</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}body{margin:0;background:#f5f5f7;color:#111}main{max-width:760px;margin:auto;padding:16px}.panel,.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}.card{position:relative;padding-right:52px}input,select,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px}button{background:#fff;color:#111;cursor:pointer}.muted{opacity:.7}.qrow{display:flex;align-items:flex-start;gap:6px;margin:6px 0}.q{font-weight:700;font-size:17px;flex:1;min-width:0}.copyq{width:auto;flex:0 0 auto;padding:3px 7px;border-radius:8px;font-size:11px;line-height:1.4;opacity:.72}.meta{font-size:13px;font-weight:700;opacity:.7}.v{font-weight:700;margin-top:8px}a{color:inherit}.open{display:block;text-align:center;text-decoration:none;border:1px solid #bbb;border-radius:12px;padding:10px 12px;margin-top:12px;font-weight:700}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.stat{border:1px solid #ddd;border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}.deadline{font-weight:700;margin-top:8px}.warn{border:1px solid #b66;border-radius:12px;padding:10px;margin-top:10px;font-weight:700}.small{font-size:13px}.dupes{margin-top:10px}.dupes a{display:block;margin-top:6px}.star{position:absolute;top:10px;right:10px;width:auto;border:0;background:transparent;font-size:24px;padding:4px 6px;line-height:1}.timegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.timebox{border:1px solid #ddd;border-radius:12px;padding:10px}.timebox b{display:block;font-size:18px;margin:4px 0}.ref{font-size:12px;opacity:.65}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.panel,.card{background:#1c1c1e;border-color:#38383a}input,select,button{background:#111;color:#fff;border-color:#444}.open,.stat,.timebox{border-color:#555}.star{background:transparent;border:0}.copyq{background:#2c2c2e}}
</style>
</head>
<body><main>
<section class="panel"><b>全期間検索</b><p class="muted">台帳に保存されている全日付を横断して検索します。データはこの端末のブラウザ内だけで扱います。</p><div id="overdue"></div><input id="search" placeholder="質問・判定・メモなどを検索"><div class="filters"><select id="grade"><option value="">答え合わせ：すべて</option><option>未判定</option><option>当たり</option><option>ハズレ</option></select><select id="formal"><option value="">正式判定：すべて</option><option>YES</option><option>NO</option><option>中立</option><option>未設定</option></select><select id="deadline"><option value="">期限：すべて</option><option value="pending-with-date">期限設定あり＋未判定</option><option value="with-date">期限設定あり</option><option value="overdue">期限切れ＋未判定</option></select><select id="important"><option value="">重要：すべて</option><option value="yes">重要のみ</option></select><select id="sort"><option value="deadline-asc" selected>並び順：期限が近い順</option><option value="seq-desc">新しい順</option><option value="seq-asc">古い順</option></select></div><div id="stats" class="stats"></div><div id="summary" class="muted" style="margin-top:8px"></div><div id="backupInfo" class="muted small" style="margin-top:8px"></div><p><a href="./">← 本番台帳へ戻る</a></p></section>
<section class="panel"><b>時間帯別の的中率</b><p class="muted small">占った時刻を復元・記録できるログだけを集計します。10件未満の時間帯は参考値です。</p><div id="timeStats" class="timegrid"></div><div id="timeNote" class="muted small" style="margin-top:8px"></div></section>
<section class="panel" id="analytics"><b>全期間ランキング・分析</b><div class="muted small">分析版 2026-09-18.5</div><p class="muted small">台帳の全ログを集計します。人物名らしき語も端末内で自動抽出し、公開コードには質問内容を保存しません。</p><div id="analyticsBody"></div></section>
<section class="panel"><b>質問の重複チェック</b><p class="muted small">意味の一致までは判定せず、完全一致と軽い表記ゆれだけ確認します。</p><input id="dupeInput" placeholder="確認したい質問を入力"><div id="dupeInfo" class="dupes muted"></div></section>
<div id="results"></div>
<script>
const KEY='uranai-ledger-v1',BACKUPKEY='uranai-ledger-last-backup-v1';let logs=[];try{logs=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(logs))}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}}
function parseLeoVerdict(text){const t=String(text||'');const exact=[...t.matchAll(/最終判定\s*[：:]\s*(YES|NO|中立)/gi)].pop();if(exact){const v=exact[1].toUpperCase();return v==='YES'?'YES':v==='NO'?'NO':'中立'}const tail=t.slice(-1600);const pats=[/(?:結論|最終|判定)[^。\n]{0,40}(YES|NO|中立)/gi,/(YES|NO|中立)\s*寄り/gi];for(const re of pats){const all=[...tail.matchAll(re)];if(all.length){const v=all[all.length-1][1].toUpperCase();return v==='YES'?'YES':v==='NO'?'NO':'中立'}}return ''}
function formalOf(x){return x.formalVerdict||parseLeoVerdict(x.leoRead)||'未設定'}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function accuracy(arr){const hit=arr.filter(x=>(x.grade||'未判定')==='当たり').length,miss=arr.filter(x=>(x.grade||'未判定')==='ハズレ').length,n=hit+miss;return n?`${Math.round(hit/n*1000)/10}% (${hit}/${n})`:'—'}
function renderStats(){const hit=logs.filter(x=>(x.grade||'未判定')==='当たり').length,miss=logs.filter(x=>(x.grade||'未判定')==='ハズレ').length,pending=logs.filter(x=>(x.grade||'未判定')==='未判定').length;document.getElementById('stats').innerHTML=`<div class="stat"><span class="muted">全件</span><b>${logs.length}</b></div><div class="stat"><span class="muted">未判定</span><b>${pending}</b></div><div class="stat"><span class="muted">当たり / ハズレ</span><b>${hit} / ${miss}</b></div><div class="stat"><span class="muted">全体的中率</span><b>${accuracy(logs)}</b></div><div class="stat"><span class="muted">正式 YES</span><b>${accuracy(logs.filter(x=>formalOf(x)==='YES'))}</b></div><div class="stat"><span class="muted">正式 NO</span><b>${accuracy(logs.filter(x=>formalOf(x)==='NO'))}</b></div><div class="stat"><span class="muted">正式 中立</span><b>${accuracy(logs.filter(x=>formalOf(x)==='中立'))}</b></div><div class="stat"><span class="muted">重要</span><b>${logs.filter(x=>x.important).length}</b></div>`}
function recoverDate(x){const m=String(x.id||'').match(/^L(\d{13})$/);if(!m)return null;const d=new Date(Number(m[1]));if(Number.isNaN(d.getTime()))return null;const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return !x.date||x.date===k?d:null}
function backfillCreatedAt(){let changed=false;for(const x of logs){if(x.createdAt)continue;const d=recoverDate(x);if(d){x.createdAt=d.toISOString();changed=true}}if(changed)save()}
function createdDate(x){if(x.createdAt){const d=new Date(x.createdAt);if(!Number.isNaN(d.getTime()))return d}return recoverDate(x)}
function timeText(x){const d=createdDate(x);return d?`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'時刻不明'}
function renderTimeStats(){const bands=[{label:'0–5時',from:0,to:5},{label:'6–11時',from:6,to:11},{label:'12–17時',from:12,to:17},{label:'18–23時',from:18,to:23}],known=logs.map(x=>({x,d:createdDate(x)})).filter(v=>v.d);document.getElementById('timeStats').innerHTML=bands.map(b=>{const arr=known.filter(v=>{const h=v.d.getHours();return h>=b.from&&h<=b.to}).map(v=>v.x),hit=arr.filter(x=>(x.grade||'未判定')==='当たり').length,miss=arr.filter(x=>(x.grade||'未判定')==='ハズレ').length,judged=hit+miss,rate=judged?`${Math.round(hit/judged*1000)/10}%`:'—',ref=arr.length<10?'<div class="ref">参考値</div>':'';return `<div class="timebox"><span>${b.label}</span><b>${rate}</b><div class="small">全${arr.length}件 ／ 当たり${hit}・ハズレ${miss}</div>${ref}</div>`}).join('');document.getElementById('timeNote').textContent=`時刻あり ${known.length}件 ／ 時刻不明 ${logs.length-known.length}件。的中率は未判定を除いて計算。`}
function rankRows(rows,labelFn,valueFn,limit=10){const a=[...rows].slice(0,limit);return a.length?a.map((x,i)=>`<div style="display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid rgba(127,127,127,.22)"><b>${i+1}</b><span>${esc(labelFn(x))}</span><b>${esc(valueFn(x))}</b></div>`).join(''):'まだデータがありません'}
function hexParts(value){const m=String(value||'').match(/^\s*(\d{1,2})\s*(.*)$/);return m?{no:Number(m[1]),name:m[2].trim()||'名称不明'}:null}
function personCandidates(q){
  const text=String(q||'').normalize('NFKC');
  const stop=new Set(['これ','それ','あれ','どれ','ここ','そこ','あそこ','今日','明日','昨日','今回','今後','最終','平均','仕事','結婚','共演','ドラマ','視聴率','質問','正式','判定','本当に','可能性','場合','世間','人気','事務所','メンバー','タイトル','年内','来年','相手','子供','交際','連絡先','朝ドラ','全話']);
  const raw=[],re=/([一-龯々ヶヵぁ-んァ-ヶー]{2,12})(?=(?:は|が|と|の|を|に|から|より|へ|も))/g;
  for(const m of text.matchAll(re)){
    let v=m[1]
      .replace(/^(?:その|この|あの)/,'')
      .replace(/^(?:と|が|は|を|に|も|の|へ|から|より)+/,'')
      .replace(/(?:と|が|は|を|に|も|の|へ)+$/,'');
    if(v.length>=2&&!stop.has(v)&&!/^\d+$/.test(v))raw.push(v)
  }
  const uniq=[...new Set(raw)].sort((a,b)=>b.length-a.length);
  return uniq.filter((v,i)=>!uniq.slice(0,i).some(longer=>longer.includes(v)))
}
function renderAnalytics(){
  const body=document.getElementById('analyticsBody');if(!body)return;
  const hours=Array(24).fill(0);let timed=0;
  for(const x of logs){const d=createdDate(x);if(!d)continue;hours[d.getHours()]++;timed++}
  const maxHour=Math.max(0,...hours);
  const heat=hours.map((n,h)=>{const lv=maxHour&&n?Math.max(1,Math.ceil(n/maxHour*5)):0,alpha=lv?0.10+lv*0.12:0.03;return `<div title="${h}時台：${n}件" style="border:1px solid #bbb;border-radius:10px;padding:7px 2px;text-align:center;background:rgba(127,127,127,${alpha})"><b style="display:block;font-size:12px">${h}</b><span style="font-size:12px">${n}</span></div>`}).join('');
  const hourRank=hours.map((n,h)=>({h,n})).filter(x=>x.n).sort((a,b)=>b.n-a.n||a.h-b.h);

  const ben=new Map(),zhi=new Map(),moves=new Map(),questions=new Map(),people=new Map();
  for(const x of logs){
    const b=hexParts(x.ben);if(b){if(!ben.has(b.no))ben.set(b.no,{...b,n:0});ben.get(b.no).n++}
    const z=hexParts(x.zhi);if(z){if(!zhi.has(z.no))zhi.set(z.no,{...z,n:0});zhi.get(z.no).n++}
    const mv=String(x.move||'').trim();if(mv&&mv!=='なし')for(const p of mv.split('・')){const k=p.trim();if(k)moves.set(k,(moves.get(k)||0)+1)}
    const nq=normalizeQ(x.q);if(nq){if(!questions.has(nq))questions.set(nq,[]);questions.get(nq).push(x)}
    for(const name of personCandidates(x.q))people.set(name,(people.get(name)||0)+1)
  }
  const benRank=[...ben.values()].sort((a,b)=>b.n-a.n||a.no-b.no);
  const zhiRank=[...zhi.values()].sort((a,b)=>b.n-a.n||a.no-b.no);
  const moveRank=[...moves.entries()].map(([name,n])=>({name,n})).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name,'ja'));
  const qRank=[...questions.values()].filter(a=>a.length>=2).sort((a,b)=>b.length-a.length||Number(b.at(-1)?.seq||0)-Number(a.at(-1)?.seq||0));
  const personRank=[...people.entries()].map(([name,n])=>({name,n})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name,'ja'));
  const vc={YES:0,NO:0,'中立':0,'未設定':0};for(const x of logs){const v=formalOf(x);vc[v in vc?v:'未設定']++}
  const decided=vc.YES+vc.NO+vc['中立'],pct=n=>decided?((n/decided)*100).toFixed(1)+'%':'0.0%';
  const verdict=[{name:'YES',n:vc.YES},{name:'NO',n:vc.NO},{name:'中立',n:vc['中立']}].sort((a,b)=>b.n-a.n).map((x,i)=>`<div style="display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid rgba(127,127,127,.22)"><b>${i+1}</b><span>${x.name}</span><b>${x.n}件・${pct(x.n)}</b></div>`).join('');

  body.innerHTML=`
  <div class="stats" style="margin-top:10px">
    <div class="stat"><span class="muted">最多時間帯</span><b>${hourRank[0]?hourRank[0].h+'時台':'—'}</b><div class="small">${hourRank[0]?hourRank[0].n+'件':''}</div></div>
    <div class="stat"><span class="muted">最多本卦</span><b>${benRank[0]?benRank[0].no:'—'}</b><div class="small">${benRank[0]?esc(benRank[0].name)+' '+benRank[0].n+'回':''}</div></div>
    <div class="stat"><span class="muted">最多之卦</span><b>${zhiRank[0]?zhiRank[0].no:'—'}</b><div class="small">${zhiRank[0]?esc(zhiRank[0].name)+' '+zhiRank[0].n+'回':''}</div></div>
    <div class="stat"><span class="muted">最多重複質問</span><b>${qRank[0]?qRank[0].length+'回':'—'}</b><div class="small">${qRank[0]?esc(qRank[0][qRank[0].length-1].q):''}</div></div>
  </div>
  <details style="margin-top:12px"><summary style="font-weight:700;cursor:pointer">時間帯ヒートマップ</summary><div class="muted small" style="margin:6px 0">時刻あり ${timed}件</div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px">${heat}</div></details>
  <details style="margin-top:14px"><summary style="font-weight:700;cursor:pointer">時間帯ランキング TOP10</summary><div style="margin-top:6px">${rankRows(hourRank,x=>x.h+'時台',x=>x.n+'件')}</div></details>
  <details style="margin-top:14px"><summary style="font-weight:700;cursor:pointer">よく占っている質問 TOP10</summary><div class="muted small" style="margin:6px 0">同文・軽い表記ゆれをまとめて集計</div><div>${rankRows(qRank,a=>a[a.length-1].q,a=>a.length+'回')}</div></details>
  <details style="margin-top:14px"><summary style="font-weight:700;cursor:pointer">正式判定 YES / NO / 中立</summary><div class="muted small" style="margin:6px 0">正式判定済み ${decided}件 ／ 未設定 ${vc['未設定']}件</div><div>${verdict}</div></details>
  <details style="margin-top:14px"><summary style="font-weight:700;cursor:pointer">本卦ランキング TOP10</summary><div style="margin-top:6px">${rankRows(benRank,x=>x.no+' '+x.name,x=>x.n+'回')}</div></details>
  <details style="margin-top:14px"><summary style="font-weight:700;cursor:pointer">之卦ランキング TOP10</summary><div style="margin-top:6px">${rankRows(zhiRank,x=>x.no+' '+x.name,x=>x.n+'回')}</div></details>
  <details style="margin-top:14px"><summary style="font-weight:700;cursor:pointer">変爻ランキング TOP10</summary><div style="margin-top:6px">${rankRows(moveRank,x=>x.name,x=>x.n+'回')}</div></details>
  <details style="margin-top:14px"><summary style="font-weight:700;cursor:pointer">人物名らしき語ランキング TOP10</summary><div class="muted small" style="margin:6px 0">質問文から自動抽出。2件以上のみ</div><div>${rankRows(personRank,x=>x.name,x=>x.n+'件')}</div></details>`;
}

function renderTop(){const overdue=logs.filter(x=>x.check&&(x.grade||'未判定')==='未判定'&&x.check<todayKey()).length;document.getElementById('overdue').innerHTML=overdue?`<div class="warn">期限切れで未判定：${overdue}件</div>`:'';const s=localStorage.getItem(BACKUPKEY);document.getElementById('backupInfo').textContent=s?`最終バックアップ記録：${new Date(s).toLocaleString()}`:'最終バックアップ記録：まだありません'}
function normalizeQ(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s　。、！？!?.,・「」『』（）()［\][\]{}【】<>＜＞:：;；'"’”“`]/g,'')}
function renderDupe(){const raw=document.getElementById('dupeInput').value.trim(),box=document.getElementById('dupeInfo');if(!raw){box.textContent='';return}const n=normalizeQ(raw),exact=logs.filter(x=>String(x.q||'').trim()===raw),near=logs.filter(x=>String(x.q||'').trim()!==raw&&normalizeQ(x.q)===n);const arr=[...exact,...near];if(!arr.length){box.textContent='同文・軽い表記ゆれ一致は見つかりません';return}box.innerHTML=`${arr.length}件見つかりました`+arr.sort((a,b)=>Number(b.seq||0)-Number(a.seq||0)).map(x=>`<a href="result.html?seq=${encodeURIComponent(x.seq||'')}">通算 #${esc(x.seq||'')} ／ ${esc(x.date||'日付不明')}</a>`).join('')}
function render(){const term=document.getElementById('search').value.trim().toLowerCase(),gf=document.getElementById('grade').value,ff=document.getElementById('formal').value,df=document.getElementById('deadline').value,imp=document.getElementById('important').value,sort=document.getElementById('sort').value;let arr=[...logs];if(term)arr=arr.filter(x=>JSON.stringify(x).toLowerCase().includes(term));if(gf)arr=arr.filter(x=>(x.grade||'未判定')===gf);if(ff)arr=arr.filter(x=>formalOf(x)===ff);if(df==='pending-with-date')arr=arr.filter(x=>x.check&&(x.grade||'未判定')==='未判定');if(df==='with-date')arr=arr.filter(x=>x.check);if(df==='overdue')arr=arr.filter(x=>x.check&&(x.grade||'未判定')==='未判定'&&x.check<todayKey());if(imp==='yes')arr=arr.filter(x=>x.important);if(sort==='seq-asc')arr.sort((a,b)=>Number(a.seq||0)-Number(b.seq||0));else if(sort==='deadline-asc')arr.sort((a,b)=>(a.check||'9999-12-31').localeCompare(b.check||'9999-12-31')||Number(a.seq||0)-Number(b.seq||0));else arr.sort((a,b)=>Number(b.seq||0)-Number(a.seq||0));const box=document.getElementById('results');box.innerHTML='';document.getElementById('summary').textContent=`${arr.length}件表示／全${logs.length}件`;arr.forEach(item=>{const formal=formalOf(item),grade=item.grade||'未判定';const e=document.createElement('div');e.className='card';e.innerHTML=`<button class="star" title="${item.important?'重要を解除':'重要にする'}" aria-label="${item.important?'重要を解除':'重要にする'}">${item.important?'★':'☆'}</button><div class="meta">${esc(item.date||'日付不明')} ／ ${esc(timeText(item))} ／ 通算 #${esc(item.seq||'')}</div><div class="qrow"><div class="q">${esc(item.q||'')}</div><button class="copyq" type="button">コピー</button></div><div class="muted">本卦：${esc(item.ben||'')}<br>変爻：${esc(item.move||'')}<br>之卦：${esc(item.zhi||'')}</div><div class="v">簡易判定：${esc(item.verdict||'未判定')}</div><div class="v">正式判定：${esc(formal)}</div><div class="v">答え合わせ：${esc(grade)}</div>${item.check?`<div class="deadline">答え合わせ予定日：${esc(item.check)}</div>`:''}${item.memo?`<div class="muted" style="margin-top:8px">メモ：${esc(item.memo)}</div>`:''}<a class="open" href="result.html?seq=${encodeURIComponent(item.seq||'')}">この占いを開く</a>`;e.querySelector('.star').onclick=()=>{item.important=!item.important;save();renderStats();renderTimeStats();render()};e.querySelector('.copyq').onclick=async ev=>{const b=ev.currentTarget,ok=await copyText(item.q||'');b.textContent=ok?'済':'失敗';setTimeout(()=>b.textContent='コピー',1200)};box.append(e)})}
['search','grade','formal','deadline','important','sort'].forEach(id=>document.getElementById(id).oninput=render);document.getElementById('dupeInput').oninput=renderDupe;backfillCreatedAt();renderTop();renderStats();renderTimeStats();renderAnalytics();render();
</script></main></body></html>
