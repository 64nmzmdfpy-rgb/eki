<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>70% Prediction Lab</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111}main{max-width:980px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:12px}h1{margin:0 0 8px;font-size:22px}h2{font-size:17px}.muted{opacity:.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}button,input,select,textarea{font:inherit;border:1px solid #bbb;border-radius:10px;padding:10px;background:#fff;color:inherit}button{cursor:pointer;font-weight:700}.good{border:2px solid #138a4b}.bad{border:2px solid #b42318}.metric{font-size:28px;font-weight:900}.small{font-size:12px}pre{white-space:pre-wrap;overflow:auto}.hidden{display:none}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.panel,button,input,select,textarea{background:#1c1c1e;border-color:#444;color:#fff}}
</style></head><body><main>
<section class="panel"><h1>70% Prediction Lab</h1><div class="muted">学習→検証で設定を固定し、未見テストは同じデータセットにつき1回だけ開封。判定基準は Balanced Accuracy 70%以上。データはこのブラウザ内だけで処理し、GitHubへ送信しません。</div></section>
<section class="panel"><h2>1. データ読み込み</h2><input id="file" type="file" accept=".csv,.json"><div id="fileInfo" class="muted small"></div><div class="grid" style="margin-top:10px"><label>正解列<select id="target"></select></label><label>時系列列（任意）<select id="time"><option value="">なし（現在順）</option></select></label></div><div id="features" class="small" style="margin-top:10px"></div></section>
<section class="panel"><h2>2. 学習・検証</h2><div class="muted small">先頭60%＝学習、次20%＝検証、最後20%＝未見テスト。標準化は学習データだけで計算。L2ロジスティック回帰の正則化強度と閾値は検証データだけで選びます。</div><button id="train" disabled style="margin-top:10px">学習して設定を固定</button><div id="trainOut"></div></section>
<section class="panel"><h2>3. 未見テスト</h2><div id="lockMsg" class="muted">学習後に開封できます。</div><button id="test" disabled>未見テストを1回だけ開封</button><div id="testOut"></div></section>
<section class="panel"><h2>4. 1件予測</h2><div class="muted small">学習後、数値特徴量をJSONで入力。例: {"f1":1,"f2":0.4}</div><textarea id="one" rows="4" style="width:100%;margin-top:8px"></textarea><button id="predict" disabled>予測</button><div id="predOut"></div></section>
<script>
let rows=[], model=null, datasetId=''; const $=id=>document.getElementById(id);
function csv(s){const lines=s.trim().split(/\r?\n/);const h=lines.shift().split(',').map(x=>x.trim());return lines.filter(Boolean).map(l=>{const a=l.split(',');const o={};h.forEach((k,i)=>o[k]=(a[i]??'').trim());return o})}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const txt=await f.text();datasetId=hash(txt);try{rows=f.name.endsWith('.json')?JSON.parse(txt):csv(txt);if(!Array.isArray(rows)||!rows.length)throw 0}catch{rows=[];alert('読み込めないデータです');return}const keys=Object.keys(rows[0]);$('target').innerHTML=keys.map(k=>`<option>${k}</option>`).join('');$('time').innerHTML='<option value="">なし（現在順）</option>'+keys.map(k=>`<option>${k}</option>`).join('');$('fileInfo').textContent=`${rows.length}件 / ${keys.length}列 / dataset ${datasetId}`;$('train').disabled=false;refreshFeatures()};
$('target').onchange=refreshFeatures;$('time').onchange=refreshFeatures;
function yval(v){const s=String(v).trim().toUpperCase();if(['1','YES','Y','TRUE'].includes(s))return 1;if(['0','NO','N','FALSE'].includes(s))return 0;return NaN}
function refreshFeatures(){if(!rows.length)return;const t=$('target').value,tm=$('time').value;const ks=Object.keys(rows[0]).filter(k=>k!==t&&k!==tm);const numeric=ks.filter(k=>rows.filter(r=>r[k]!==''&&r[k]!=null).every(r=>Number.isFinite(Number(r[k]))));$('features').textContent='使用する数値特徴量: '+(numeric.join(', ')||'なし')}
function prep(){const t=$('target').value,tm=$('time').value;let a=rows.map((r,i)=>({...r,__i:i,__y:yval(r[t])})).filter(r=>Number.isFinite(r.__y));if(tm)a.sort((x,y)=>String(x[tm]).localeCompare(String(y[tm]))||x.__i-y.__i);const ks=Object.keys(rows[0]).filter(k=>k!==t&&k!==tm).filter(k=>a.filter(r=>r[k]!==''&&r[k]!=null).every(r=>Number.isFinite(Number(r[k]))));if(!ks.length)throw Error('数値特徴量がありません');const X=a.map(r=>ks.map(k=>Number(r[k]))),Y=a.map(r=>r.__y);const n=a.length,n1=Math.floor(n*.6),n2=Math.floor(n*.8);if(n1<10||n2-n1<4||n-n2<4)throw Error('件数が少なすぎます');return{X,Y,ks,n1,n2}}
function stats(X,n){const p=X[0].length,mu=Array(p).fill(0),sd=Array(p).fill(0);for(let i=0;i<n;i++)for(let j=0;j<p;j++)mu[j]+=X[i][j]/n;for(let i=0;i<n;i++)for(let j=0;j<p;j++)sd[j]+=(X[i][j]-mu[j])**2/n;for(let j=0;j<p;j++)sd[j]=Math.sqrt(sd[j])||1;return{mu,sd}}
function zrow(x,s){return x.map((v,j)=>(v-s.mu[j])/s.sd[j])}
function sig(z){if(z>35)return 1;if(z<-35)return 0;return 1/(1+Math.exp(-z))}
function fit(X,Y,lambda){const p=X[0].length,w=Array(p+1).fill(0),lr=.05;for(let it=0;it<1800;it++){const g=Array(p+1).fill(0);for(let i=0;i<X.length;i++){let z=w[0];for(let j=0;j<p;j++)z+=w[j+1]*X[i][j];const e=sig(z)-Y[i];g[0]+=e;for(let j=0;j<p;j++)g[j+1]+=e*X[i][j]}g[0]/=X.length;for(let j=1;j<=p;j++)g[j]=g[j]/X.length+lambda*w[j];for(let j=0;j<=p;j++)w[j]-=lr*g[j]}return w}
function prob(x,w){let z=w[0];for(let j=0;j<x.length;j++)z+=w[j+1]*x[j];return sig(z)}
function score(P,Y,th){let tp=0,tn=0,fp=0,fn=0;for(let i=0;i<Y.length;i++){const q=P[i]>=th?1:0;if(q&&Y[i])tp++;else if(!q&&!Y[i])tn++;else if(q&&!Y[i])fp++;else fn++}const tpr=tp+fn?tp/(tp+fn):NaN,tnr=tn+fp?tn/(tn+fp):NaN;return{bacc:(tpr+tnr)/2,acc:(tp+tn)/(Y.length||1),tpr,tnr,tp,tn,fp,fn}}
$('train').onclick=()=>{try{const d=prep(),s=stats(d.X,d.n1),ZX=d.X.map(x=>zrow(x,s));const trX=ZX.slice(0,d.n1),trY=d.Y.slice(0,d.n1),vaX=ZX.slice(d.n1,d.n2),vaY=d.Y.slice(d.n1,d.n2);if(new Set(trY).size<2||new Set(vaY).size<2)throw Error('学習/検証の両方にYESとNOが必要です');let best=null;for(const l of [0,.001,.01,.1,1,10]){const w=fit(trX,trY,l),P=vaX.map(x=>prob(x,w));for(let th=.30;th<=.70;th+=.02){const sc=score(P,vaY,Number(th.toFixed(2)));if(!best||sc.bacc>best.sc.bacc)best={l,th:Number(th.toFixed(2)),w,sc}}}model={...d,s,lambda:best.l,th:best.th,w:best.w,trained:true};$('trainOut').innerHTML=`<p>固定完了：λ=${best.l} / threshold=${best.th} / 検証BAcc=<b>${(best.sc.bacc*100).toFixed(1)}%</b></p>`;const lock=localStorage.getItem('predlab-test-'+datasetId);$('test').disabled=!!lock;$('lockMsg').textContent=lock?'このデータセットの未見テストはすでに開封済み。再開封は禁止。':'設定固定済み。未見テストを開封できます。';$('predict').disabled=false}catch(e){alert(e.message)}};
$('test').onclick=()=>{if(!model)return;if(localStorage.getItem('predlab-test-'+datasetId)){alert('このデータセットは開封済みです');return}const ZX=model.X.map(x=>zrow(x,model.s)),teX=ZX.slice(model.n2),teY=model.Y.slice(model.n2);if(new Set(teY).size<2){alert('未見テストにYESとNOの両方がありません');return}const sc=score(teX.map(x=>prob(x,model.w)),teY,model.th),pass=sc.bacc>=.70;localStorage.setItem('predlab-test-'+datasetId,JSON.stringify({time:new Date().toISOString(),bacc:sc.bacc}));$('test').disabled=true;$('lockMsg').textContent='開封済み。';$('testOut').innerHTML=`<div class="panel ${pass?'good':'bad'}"><div>${pass?'通過':'ボツ'}</div><div class="metric">BAcc ${(sc.bacc*100).toFixed(1)}%</div><div>Accuracy ${(sc.acc*100).toFixed(1)}% / YES再現率 ${(sc.tpr*100).toFixed(1)}% / NO再現率 ${(sc.tnr*100).toFixed(1)}%</div><div class="small">TP ${sc.tp} / TN ${sc.tn} / FP ${sc.fp} / FN ${sc.fn} / n=${teY.length}</div></div>`};
$('predict').onclick=()=>{if(!model)return;try{const o=JSON.parse($('one').value),x=model.ks.map(k=>Number(o[k]));if(x.some(v=>!Number.isFinite(v)))throw 0;const p=prob(zrow(x,model.s),model.w),q=p>=model.th?'YES':'NO';$('predOut').innerHTML=`<p><b>${q}</b> / YES確率 ${(p*100).toFixed(1)}%</p>`}catch{alert('学習時と同じ数値特徴量をJSONで入れてください')}};
</script></main></body></html>
