<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>70% Prediction Lab</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111}main{max-width:980px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:12px}h1{margin:0 0 8px;font-size:22px}h2{font-size:17px}.muted{opacity:.65}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}button,input,select,textarea{font:inherit;border:1px solid #bbb;border-radius:10px;padding:10px;background:#fff;color:inherit}button{cursor:pointer;font-weight:700}.good{border:2px solid #138a4b}.bad{border:2px solid #b42318}.metric{font-size:28px;font-weight:900}.tag{display:inline-block;padding:3px 7px;border:1px solid #bbb;border-radius:999px;margin:2px;font-size:12px}.topnav{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap}.topnav a{color:inherit;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}th,td{border-bottom:1px solid #ddd;padding:8px 6px;text-align:right}th:first-child,td:first-child{text-align:left}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.panel,button,input,select,textarea{background:#1c1c1e;border-color:#444;color:#fff}th,td{border-color:#444}}</style></head><body><main>
<section class="panel"><h1>70% Prediction Lab</h1><div class="muted">学習60%→検証20%で設定固定→未見20%を1回だけ開封。レオ読み・易・意味層・全部入りを同条件で比較し、採用モデルは前向き試験用に凍結できます。</div><div class="topnav"><a href="predictor-lab-stats.html">通算検証へ →</a><a href="predictor-live.html">前向き試験へ →</a><span id="historyCount" class="small muted"></span><span id="modelState" class="small muted"></span></div></section>
<section class="panel"><h2>1. データ</h2><input id="file" type="file" accept=".csv,.json"><div id="fileInfo" class="small muted"></div><div class="grid" style="margin-top:10px"><label>正解列<select id="target"></select></label><label>時系列列<select id="time"><option value="">なし</option></select></label></div><div id="features" class="small" style="margin-top:10px"></div></section>
<section class="panel"><h2>2. 学習・検証</h2><button id="train" disabled>全方式を学習して固定</button><div id="trainOut"></div></section>
<section class="panel"><h2>3. 未見テスト</h2><div id="lockMsg" class="small muted">学習後に開封できます。</div><button id="test" disabled>未見20%を1回だけ開封</button><div id="testOut"></div></section>
<section class="panel"><h2>4. 前向き試験用モデル</h2><div class="small muted">未見テストを開封した後、採用したい方式を凍結保存します。凍結後の係数・閾値・標準化値は前向き試験中に自動変更されません。</div><div class="grid" style="margin-top:10px"><label>方式<select id="freezeKind"></select></label><button id="freeze" disabled>このモデルを凍結保存</button></div><div id="freezeMsg" class="small muted" style="margin-top:8px"></div></section>
<section class="panel"><h2>5. 1件予測</h2><textarea id="one" rows="5" style="width:100%" placeholder='{"leo_pred":"YES","leo_conf":"高","iching_pred":"NO","base_rate":0.55,"domain":"芸能","horizon":"長期"}'></textarea><button id="predict" disabled>予測</button><div id="predOut"></div></section>
<section class="panel"><h2>6. 通算成績</h2><div id="historyOut"></div></section>
<section class="panel"><h2>7. 何が効いているか</h2><div id="importanceOut" class="small muted">学習後に表示。</div></section>
<script>
let rows=[],models=[],mainModel=null,datasetId='';const $=id=>document.getElementById(id),HKEY='predlab-history-v1',MKEY='predlab-frozen-model-v1';
function csv(s){const ls=s.trim().split(/\r?\n/),h=ls.shift().split(',').map(x=>x.trim());return ls.filter(Boolean).map(l=>{const a=l.split(','),o={};h.forEach((k,i)=>o[k]=(a[i]??'').trim());return o})}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}
function yval(v){const s=String(v).trim().toUpperCase();if(['1','YES','Y','TRUE'].includes(s))return 1;if(['0','NO','N','FALSE'].includes(s))return 0;return NaN}
function yn(v){const y=yval(v);return Number.isFinite(y)?(y?1:-1):NaN}function conf(v){const s=String(v).trim();return s==='高'?3:s==='中'?2:s==='低'?1:Number(v)}function horizon(v){const s=String(v).trim();return s==='短期'?1:s==='中期'?2:s==='長期'?3:Number(v)}
function history(){try{const h=JSON.parse(localStorage.getItem(HKEY)||'[]');return Array.isArray(h)?h:[]}catch{return[]}}function setStatus(){$('historyCount').textContent=`未見履歴 ${history().length}セット`;try{const m=JSON.parse(localStorage.getItem(MKEY)||'null');$('modelState').textContent=m?`凍結モデル ${m.name}`:'凍結モデルなし'}catch{$('modelState').textContent='凍結モデルなし'}}
function buildSpec(a,t,tm){const keys=Object.keys(a[0]).filter(k=>k!==t&&k!==tm),sp=[];for(const k of keys){if(k==='leo_pred'||k==='iching_pred')sp.push({k,type:'yn'});else if(k==='leo_conf')sp.push({k,type:'conf'});else if(k==='horizon')sp.push({k,type:'horizon'});else if(k==='domain'){for(const c of[...new Set(a.map(r=>String(r[k]??'').trim()).filter(Boolean))].sort())sp.push({k,type:'cat',cat:c,name:`domain=${c}`})}else{const v=a.filter(r=>r[k]!==''&&r[k]!=null).map(r=>Number(r[k]));if(v.length&&v.every(Number.isFinite))sp.push({k,type:'num'})}}return sp}
function enc(r,sp){return sp.map(s=>s.type==='yn'?yn(r[s.k]):s.type==='conf'?conf(r[s.k]):s.type==='horizon'?horizon(r[s.k]):s.type==='cat'?(String(r[s.k]??'').trim()===s.cat?1:0):Number(r[s.k]))}
function sub(sp,k){if(k==='all')return sp;if(k==='leo')return sp.filter(s=>['leo_pred','leo_conf'].includes(s.k));if(k==='iching')return sp.filter(s=>s.k==='iching_pred');if(k==='semantic')return sp.filter(s=>['leo_pred','leo_conf','base_rate','domain','horizon'].includes(s.k));return[]}
function stats(X,n){const p=X[0].length,mu=Array(p).fill(0),sd=Array(p).fill(0);for(let i=0;i<n;i++)for(let j=0;j<p;j++)mu[j]+=X[i][j]/n;for(let i=0;i<n;i++)for(let j=0;j<p;j++)sd[j]+=(X[i][j]-mu[j])**2/n;for(let j=0;j<p;j++)sd[j]=Math.sqrt(sd[j])||1;return{mu,sd}}function z(x,s){return x.map((v,j)=>(v-s.mu[j])/s.sd[j])}function sig(v){return v>35?1:v<-35?0:1/(1+Math.exp(-v))}
function fit(X,Y,l){const p=X[0].length,w=Array(p+1).fill(0),lr=.05;for(let it=0;it<1800;it++){const g=Array(p+1).fill(0);for(let i=0;i<X.length;i++){let q=w[0];for(let j=0;j<p;j++)q+=w[j+1]*X[i][j];const e=sig(q)-Y[i];g[0]+=e;for(let j=0;j<p;j++)g[j+1]+=e*X[i][j]}g[0]/=X.length;for(let j=1;j<=p;j++)g[j]=g[j]/X.length+l*w[j];for(let j=0;j<=p;j++)w[j]-=lr*g[j]}return w}function prob(x,w){let q=w[0];for(let j=0;j<x.length;j++)q+=w[j+1]*x[j];return sig(q)}
function score(P,Y,th){let tp=0,tn=0,fp=0,fn=0;for(let i=0;i<Y.length;i++){const q=P[i]>=th?1:0;if(q&&Y[i])tp++;else if(!q&&!Y[i])tn++;else if(q&&!Y[i])fp++;else fn++}const tpr=tp+fn?tp/(tp+fn):NaN,tnr=tn+fp?tn/(tn+fp):NaN;return{bacc:(tpr+tnr)/2,acc:(tp+tn)/(Y.length||1),tpr,tnr,tp,tn,fp,fn}}
function base(){const t=$('target').value,tm=$('time').value;let a=rows.map((r,i)=>({...r,__i:i,__y:yval(r[t])})).filter(r=>Number.isFinite(r.__y));if(tm)a.sort((x,y)=>String(x[tm]).localeCompare(String(y[tm]))||x.__i-y.__i);const sp=buildSpec(a,t,tm),n=a.length,n1=Math.floor(n*.6),n2=Math.floor(n*.8);if(!sp.length||n1<10||n2-n1<4||n-n2<4)throw Error('特徴量または件数不足');return{a,sp,n1,n2}}
function trainOne(b,name,kind){const sp=sub(b.sp,kind);if(!sp.length)return null;const pack=b.a.map(r=>({x:enc(r,sp),y:r.__y}));if(pack.some(q=>q.x.some(v=>!Number.isFinite(v))))return null;const X=pack.map(q=>q.x),Y=pack.map(q=>q.y),s=stats(X,b.n1),ZX=X.map(x=>z(x,s)),vaX=ZX.slice(b.n1,b.n2),vaY=Y.slice(b.n1,b.n2);if(new Set(Y.slice(0,b.n1)).size<2||new Set(vaY).size<2)return null;let best=null;for(const l of[0,.001,.01,.1,1,10]){const w=fit(ZX.slice(0,b.n1),Y.slice(0,b.n1),l),P=vaX.map(x=>prob(x,w));for(let th=.30;th<=.70;th+=.02){const sc=score(P,vaY,+th.toFixed(2));if(!best||sc.bacc>best.sc.bacc)best={l,th:+th.toFixed(2),w,sc}}}return{name,kind,spec:sp,X,Y,n1:b.n1,n2:b.n2,s,w:best.w,th:best.th,lambda:best.l,val:best.sc}}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const txt=await f.text();datasetId=hash(txt);try{rows=f.name.endsWith('.json')?JSON.parse(txt):csv(txt);if(!Array.isArray(rows)||!rows.length)throw 0}catch{alert('読み込めないデータ');return}const ks=Object.keys(rows[0]);$('target').innerHTML=ks.map(k=>`<option>${k}</option>`).join('');$('time').innerHTML='<option value="">なし</option>'+ks.map(k=>`<option>${k}</option>`).join('');$('fileInfo').textContent=`${rows.length}件 / dataset ${datasetId}`;$('features').textContent='列：'+ks.join(' / ');$('train').disabled=false};
$('train').onclick=()=>{try{const b=base();models=[trainOne(b,'全部入り','all'),trainOne(b,'レオ読み','leo'),trainOne(b,'易だけ','iching'),trainOne(b,'意味層','semantic')].filter(Boolean);if(!models.length)throw Error('学習不可');mainModel=models.find(m=>m.kind==='all')||models[0];$('trainOut').innerHTML='<table><tr><th>方式</th><th>λ</th><th>閾値</th><th>検証BAcc</th></tr>'+models.map(m=>`<tr><td>${m.name}</td><td>${m.lambda}</td><td>${m.th}</td><td>${(m.val.bacc*100).toFixed(1)}%</td></tr>`).join('')+'</table>';$('freezeKind').innerHTML=models.map(m=>`<option value="${m.kind}">${m.name}</option>`).join('');const lock=localStorage.getItem('predlab-test-'+datasetId);$('test').disabled=!!lock;$('lockMsg').textContent=lock?'このデータは開封済み':'設定固定済み。未見を開封可能';$('predict').disabled=false;renderImportance()}catch(e){alert(e.message)}};
$('test').onclick=()=>{if(!models.length||localStorage.getItem('predlab-test-'+datasetId))return;const rr=[];for(const m of models){const teY=m.Y.slice(m.n2);if(new Set(teY).size<2)continue;const sc=score(m.X.map(x=>z(x,m.s)).slice(m.n2).map(x=>prob(x,m.w)),teY,m.th);rr.push({m,sc})}if(!rr.length){alert('未見にYES/NO両方が必要');return}const rec={datasetId,time:new Date().toISOString(),results:rr.map(r=>({kind:r.m.kind,name:r.m.name,...r.sc}))};localStorage.setItem('predlab-test-'+datasetId,JSON.stringify(rec));const h=history();if(!h.some(x=>x.datasetId===datasetId)){h.push(rec);localStorage.setItem(HKEY,JSON.stringify(h))}$('test').disabled=true;$('freeze').disabled=false;const best=rr.slice().sort((a,b)=>b.sc.bacc-a.sc.bacc)[0];$('testOut').innerHTML=`<div class="${best.sc.bacc>=.7?'good':'bad'} panel"><div class="metric">最高 ${(best.sc.bacc*100).toFixed(1)}%</div><table><tr><th>方式</th><th>BAcc</th><th>Accuracy</th><th>YES再現</th><th>NO再現</th></tr>${rr.map(r=>`<tr><td>${r.m.name}</td><td>${(r.sc.bacc*100).toFixed(1)}%</td><td>${(r.sc.acc*100).toFixed(1)}%</td><td>${(r.sc.tpr*100).toFixed(1)}%</td><td>${(r.sc.tnr*100).toFixed(1)}%</td></tr>`).join('')}</table></div>`;renderHistory();setStatus()};
$('freeze').onclick=()=>{const m=models.find(x=>x.kind===$('freezeKind').value);if(!m)return;const frozen={version:1,frozen_at:new Date().toISOString(),datasetId,name:m.name,kind:m.kind,spec:m.spec,s:m.s,w:m.w,th:m.th,lambda:m.lambda};localStorage.setItem(MKEY,JSON.stringify(frozen));$('freezeMsg').textContent=`${m.name} を凍結保存。前向き試験で自動使用します。`;setStatus()};
$('predict').onclick=()=>{if(!mainModel)return;try{const o=JSON.parse($('one').value),x=enc(o,mainModel.spec);if(x.some(v=>!Number.isFinite(v)))throw 0;const p=prob(z(x,mainModel.s),mainModel.w);$('predOut').innerHTML=`<b>${p>=mainModel.th?'YES':'NO'}</b> / YES確率 ${(p*100).toFixed(1)}%`}catch{alert('必要特徴量を入れてください')}};
function renderHistory(){const h=history(),a={};for(const e of h)for(const r of e.results||[]){const x=a[r.kind]||(a[r.kind]={n:0,tp:0,tn:0,fp:0,fn:0});x.n++;x.tp+=r.tp||0;x.tn+=r.tn||0;x.fp+=r.fp||0;x.fn+=r.fn||0}const names={all:'全部入り',leo:'レオ読み',iching:'易だけ',semantic:'意味層'},html=Object.entries(a).map(([k,x])=>{const yp=x.tp+x.fn,np=x.tn+x.fp,b=yp&&np?((x.tp/yp+x.tn/np)/2):NaN;return`<tr><td>${names[k]||k}</td><td>${x.n}</td><td>${Number.isFinite(b)?(b*100).toFixed(1)+'%':'—'}</td></tr>`}).join('');$('historyOut').innerHTML=html?`<table><tr><th>方式</th><th>未見セット</th><th>通算BAcc</th></tr>${html}</table>`:'<div class="small muted">履歴なし</div>'}
function source(s){return['leo_pred','leo_conf'].includes(s.k)?'レオ':s.k==='iching_pred'?'易':s.k==='base_rate'?'事前':s.k==='domain'?'分野':s.k==='horizon'?'時間':'その他'}function renderImportance(){const m=mainModel;if(!m)return;const it=m.spec.map((s,j)=>({n:s.name||s.k,g:source(s),v:Math.abs(m.w[j+1]||0)})).sort((a,b)=>b.v-a.v),tot=it.reduce((q,x)=>q+x.v,0)||1;$('importanceOut').innerHTML=it.slice(0,12).map(x=>`<span class="tag">${x.n} ${x.g} ${(100*x.v/tot).toFixed(1)}%</span>`).join('')}
renderHistory();setStatus();
</script></main></body></html>
