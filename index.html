<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>占い台帳</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}body{margin:0;background:#f5f5f7;color:#111}main{max-width:760px;margin:auto;padding:16px}.panel,.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}textarea,input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px}button{font-size:16px;border:1px solid #bbb;border-radius:12px;padding:11px 14px;background:#fff;color:#111;cursor:pointer}.primary{width:100%;font-weight:700;background:#111;color:#fff;border-color:#111}.leo{width:100%;font-weight:700;margin-top:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.title{font-size:18px;font-weight:700}.muted{opacity:.72}.qrow{display:flex;align-items:flex-start;gap:6px;margin:6px 0}.q{font-weight:700;flex:1;min-width:0}.copyq{width:auto;flex:0 0 auto;padding:3px 7px;border-radius:8px;font-size:11px;line-height:1.4;opacity:.72}.verdict{font-size:18px;font-weight:800;margin-top:10px}.formalVerdict{font-size:18px;font-weight:800;margin-top:6px}.detail{display:none;border-top:1px solid #ddd;margin-top:14px;padding-top:14px}.card.open .detail{display:block}.active{outline:2px solid currentColor;font-weight:700}.danger{width:100%;margin-top:12px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{font-size:13px;margin-top:8px;opacity:.72}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:48px;padding:4px;border-radius:10px;font-size:13px}.day b{display:block}.day.sel{outline:2px solid currentColor}.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;opacity:.65;margin-bottom:4px}.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.hidden{display:none!important}.saved{font-size:13px;opacity:.72;margin-top:6px}.numline{font-size:13px;font-weight:700;opacity:.75;margin-bottom:6px}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.card,.panel{background:#1c1c1e;border-color:#38383a}input,textarea{background:#111;color:#fff;border-color:#444}button{background:#2c2c2e;color:#fff;border-color:#555}.primary{background:#f5f5f7;color:#111}.copyq{background:#2c2c2e}}
</style>

<body>
<main>
<section class="panel"><div class="title">占う</div><textarea id="q" rows="3" placeholder="質問を入力"></textarea><button id="cast" class="primary">占う</button></section>
<section class="panel"><div class="title">バックアップ</div><div class="toolbar"><button id="backup">バックアップを保存</button><button id="restoreBtn">バックアップから復元</button></div><input id="restoreFile" class="hidden" type="file" accept=".json,application/json"><div id="backupStatus" class="status"></div></section>
<section class="panel"><div class="title">検索・抽出</div><div class="toolbar"><input id="search" placeholder="この日の検索"><button type="button" onclick="location.href='search-all.html?v=20260918-4'">全期間検索</button></div></section>
<section class="panel"><div class="calhead"><button id="pm">←</button><b id="mt"></b><button id="nm">→</button></div><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="calendar" class="calendar"></div><button id="today" style="width:100%;margin-top:8px">今月</button></section>
<div id="dateTitle" class="title"></div><div id="cards"></div>
</main>
<script>
const KEY='uranai-ledger-v1';
const SEQKEY='uranai-ledger-seq-v1';
const TODAY=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let logs=[];try{logs=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
let maxSeq=Number(localStorage.getItem(SEQKEY)||0);for(const x of logs){if(Number(x.seq)>maxSeq)maxSeq=Number(x.seq)}
for(const x of logs){if(!x.seq){maxSeq++;x.seq=maxSeq}}localStorage.setItem(SEQKEY,String(maxSeq));
let selected=TODAY(),viewY=new Date().getFullYear(),viewM=new Date().getMonth()+1;
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(logs));localStorage.setItem(SEQKEY,String(maxSeq))}
const trig={'111':'乾','110':'兌','101':'離','100':'震','011':'巽','010':'坎','001':'艮','000':'坤'};
const map={"乾乾":[1,"乾為天"],"乾兌":[10,"天沢履"],"乾離":[13,"天火同人"],"乾震":[25,"天雷无妄"],"乾巽":[44,"天風姤"],"乾坎":[6,"天水訟"],"乾艮":[33,"天山遯"],"乾坤":[12,"天地否"],"兌乾":[43,"沢天夬"],"兌兌":[58,"兌為沢"],"兌離":[49,"沢火革"],"兌震":[17,"沢雷随"],"兌巽":[28,"沢風大過"],"兌坎":[47,"沢水困"],"兌艮":[31,"沢山咸"],"兌坤":[45,"沢地萃"],"離乾":[14,"火天大有"],"離兌":[38,"火沢睽"],"離離":[30,"離為火"],"離震":[21,"火雷噬嗑"],"離巽":[50,"火風鼎"],"離坎":[64,"火水未済"],"離艮":[56,"火山旅"],"離坤":[35,"火地晋"],"震乾":[34,"雷天大壮"],"震兌":[54,"雷沢帰妹"],"震離":[55,"雷火豊"],"震震":[51,"震為雷"],"震巽":[32,"雷風恒"],"震坎":[40,"雷水解"],"震艮":[62,"雷山小過"],"震坤":[16,"雷地豫"],"巽乾":[9,"風天小畜"],"巽兌":[61,"風沢中孚"],"巽離":[37,"風火家人"],"巽震":[42,"風雷益"],"巽巽":[57,"巽為風"],"巽坎":[59,"風水渙"],"巽艮":[53,"風山漸"],"巽坤":[20,"風地観"],"坎乾":[5,"水天需"],"坎兌":[60,"水沢節"],"坎離":[63,"水火既済"],"坎震":[3,"水雷屯"],"坎巽":[48,"水風井"],"坎坎":[29,"坎為水"],"坎艮":[39,"水山蹇"],"坎坤":[8,"水地比"],"艮乾":[26,"山天大畜"],"艮兌":[41,"山沢損"],"艮離":[22,"山火賁"],"艮震":[27,"山雷頤"],"艮巽":[18,"山風蠱"],"艮坎":[4,"山水蒙"],"艮艮":[52,"艮為山"],"艮坤":[23,"山地剥"],"坤乾":[11,"地天泰"],"坤兌":[19,"地沢臨"],"坤離":[36,"地火明夷"],"坤震":[24,"地雷復"],"坤巽":[46,"地風升"],"坤坎":[7,"地水師"],"坤艮":[15,"地山謙"],"坤坤":[2,"坤為地"]};
const sem={1:'創造・前進',2:'受容・支える',3:'始まりの困難',4:'学習・未熟',5:'待機',6:'対立',7:'組織力',8:'結びつき',9:'小さな蓄積',10:'慎重',11:'通泰',12:'停滞',13:'協働',14:'繁栄',15:'謙虚',16:'勢い',17:'流れに従う',18:'修復',19:'接近',20:'観察',21:'障害除去',22:'外見',23:'衰退',24:'回復',25:'予期せぬこと',26:'蓄積',27:'養い',28:'過重',29:'危険',30:'明晰',31:'感応',32:'持続',33:'退避',34:'強勢',35:'進展',36:'防衛',37:'家・役割',38:'相違',39:'難航',40:'解放',41:'減らす',42:'増益',43:'決断',44:'遭遇',45:'集合',46:'上昇',47:'制約',48:'基盤',49:'変革',50:'成熟',51:'衝撃',52:'静止',53:'漸進',54:'不完全な結合',55:'豊盛',56:'一時性',57:'浸透',58:'交流',59:'分散',60:'制限',61:'信頼',62:'小さな超過',63:'完成',64:'未完成'};
function yao(){const r=crypto.getRandomValues(new Uint32Array(1))[0]%16;return r===0?6:r<=5?7:r<=12?8:9}
function hex(vals){const bits=vals.map(v=>v===7||v===9?1:0),lo=trig[bits.slice(0,3).join('')],up=trig[bits.slice(3).join('')];return map[up+lo]}
function line(v,i){const y=v===7||v===9;if(i===0)return y?'初九':'初六';if(i===5)return y?'上九':'上六';return (y?'九':'六')+(i+1)}
function interp(q,b,c,mv){const pos=[8,11,14,16,19,24,31,35,40,42,44,45,46,49,53,55,58,61,63],neg=[12,23,29,33,38,39,47,52,59,60,64];const s=pos.includes(c[0])?1:neg.includes(c[0])?-1:0;return{summary:`本卦は「${sem[b[0]]}」。${mv.length?'途中で変化が入り、':'大きな転換は少なく、'}最終的には「${sem[c[0]]}」へ向かう流れ。`,verdict:s>0?'YES寄り':s<0?'NO寄り':'中立',detail:`これはブラウザ内の簡易読みです。本卦は${b[1]}、変爻は${mv.length?mv.join('・'):'なし'}、之卦は${c[1]}。質問に即した詳しい解釈は「レオに読ませる」を使ってください。`}}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function parseLeoVerdict(text){const t=String(text||'');const exact=[...t.matchAll(/最終判定\s*[：:]\s*(YES|NO|中立)/gi)].pop();if(exact){const v=exact[1].toUpperCase();return v==='YES'?'YES':v==='NO'?'NO':'中立'}const tail=t.slice(-1600);const pats=[/(?:結論|最終|判定)[^。\n]{0,40}(YES|NO|中立)/gi,/(YES|NO|中立)\s*寄り/gi];for(const re of pats){const all=[...tail.matchAll(re)];if(all.length){const v=all[all.length-1][1].toUpperCase();return v==='YES'?'YES':v==='NO'?'NO':'中立'}}return ''}
function saveFormalFromLeo(item){const text=String(item.leoRead||''),v=parseLeoVerdict(text),count=[...text.matchAll(/最終判定\s*[：:]\s*(?:YES|NO|中立)/gi)].length,ready=!item.repairNeedsReread||(text.length>Number(item.repairBaseLeoLength||0)&&count>Number(item.repairBaseVerdictCount||0));if(v&&ready){item.formalVerdict=v;item.formalVerdictSavedAt=new Date().toISOString();delete item.formalVerdictNeedsReread;delete item.repairNeedsReread;delete item.repairBaseLeoLength;delete item.repairBaseVerdictCount}}
function leoPrompt(item){return `次の易占いを、質問そのものに即して詳しく読んでください。一般的な卦のキーワードを並べるだけではなく、この質問では本卦が何を意味するか、変爻が何を動かすか、之卦が最終的に何を示すかを自然な日本語で説明し、最後にYES/NO/中立の判定と理由を出してください。返答はそのまま台帳へ貼って保存するので、JSONやコードブロックは不要です。\n\n重要：返答の最後は必ず独立した1行で「最終判定：YES」「最終判定：NO」「最終判定：中立」のいずれか1つを書いてください。この表記は変えないでください。\n\n通算番号：${item.seq}\n質問：${item.q}\n生データ（初爻→上爻）：${item.raw}\n本卦：${item.ben}\n変爻：${item.move}\n之卦：${item.zhi}`}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}}
async function sendToLeo(item,btn){const prompt=leoPrompt(item);const ok=await copyText(prompt);btn.textContent=ok?'占い文をコピーした':'コピーできなかった';setTimeout(()=>btn.textContent='レオに読ませる',1800)}
async function pasteLeo(item,area,btn){btn.textContent='貼り付けを待っています…';area.focus();try{if(!navigator.clipboard||!navigator.clipboard.readText)throw new Error();const text=await navigator.clipboard.readText();if(!text)throw new Error();const append=item.repairNeedsReread&&String(item.leoRead||'').trim(),next=append?`${String(item.leoRead).trimEnd()}\n\n--- 48・59対応修正後の再読 ---\n\n${text}`:text;area.value=next;item.leoRead=next;item.leoSavedAt=new Date().toISOString();saveFormalFromLeo(item);saveLocal();render();btn.textContent='貼り付け・保存済み'}catch(e){area.focus();const end=area.value.length;try{area.setSelectionRange(end,end)}catch(_e){}btn.textContent='⌘Vで貼り付け（自動保存）'}}
function renderCal(){document.getElementById('mt').textContent=`${viewY}年${viewM}月`;const c=document.getElementById('calendar');c.innerHTML='';const first=new Date(viewY,viewM-1,1).getDay(),days=new Date(viewY,viewM,0).getDate();for(let i=0;i<first;i++)c.append(document.createElement('div'));for(let d=1;d<=days;d++){const k=`${viewY}-${String(viewM).padStart(2,'0')}-${String(d).padStart(2,'0')}`,n=logs.filter(x=>x.date===k).length,b=document.createElement('button');b.className='day'+(k===selected?' sel':'');b.innerHTML=`<b>${d}</b>${n?`${n}件`:''}`;b.onclick=()=>{selected=k;render()};c.append(b)}}
function render(){renderCal();document.getElementById('dateTitle').textContent=selected;const term=document.getElementById('search').value.toLowerCase(),box=document.getElementById('cards');box.innerHTML='';const dayLogs=logs.filter(x=>x.date===selected).sort((a,b)=>Number(a.seq)-Number(b.seq));dayLogs.filter(x=>JSON.stringify(x).toLowerCase().includes(term)).forEach(item=>{const dayNo=dayLogs.findIndex(x=>x.id===item.id)+1;const oldFormal=item.formalVerdict||parseLeoVerdict(item.leoRead)||'未設定',formal=item.formalVerdictNeedsReread?`要再読（旧判定：${oldFormal}）`:oldFormal;const e=document.createElement('div');e.className='card';e.innerHTML=`<div class='numline'>#${dayNo} ／ 通算 #${esc(item.seq)}</div><div class='qrow'><div class='q'>${esc(item.q)}</div><button class='copyq' type='button'>コピー</button></div><div class='muted'>生データ：${esc(item.raw)}<br>本卦：${esc(item.ben)}<br>変爻：${esc(item.move)}<br>之卦：${esc(item.zhi)}</div><div style='margin-top:8px'>${esc(item.summary)}</div><div class='verdict'>簡易判定：${esc(item.verdict)}</div><div class='formalVerdict'>正式判定：${esc(formal)}</div><button class='leo'>レオに読ませる</button><div class='three' style='margin-top:12px'>${['未判定','当たり','ハズレ'].map(g=>`<button data-g='${g}' class='${item.grade===g?'active':''}'>${g}</button>`).join('')}</div><button class='toggle' style='width:100%;margin-top:10px'>詳細</button><div class='detail'><div class='title'>レオの読み（この端末だけ）</div><button class='pasteLeo' style='width:100%;margin:8px 0'>クリップボードから貼る</button><textarea class='leoRead' rows='7' placeholder='ChatGPTの返答をここへ貼る'>${esc(item.leoRead||'')}</textarea><div class='saved'>入力すると自動保存。固定形式の最終判定は正式判定にも反映されます。</div><div class='title' style='margin-top:16px'>簡易読み</div><p>${esc(item.detail)}</p><label>答え合わせ予定日<input type='date' class='check' value='${esc(item.check||'')}'></label><label>メモ<textarea class='memo' rows='3'>${esc(item.memo||'')}</textarea></label><button class='danger'>この占いを削除</button></div>`;e.querySelector('.copyq').onclick=async ev=>{const b=ev.currentTarget,ok=await copyText(item.q);b.textContent=ok?'済':'失敗';setTimeout(()=>b.textContent='コピー',1200)};e.querySelector('.leo').onclick=ev=>sendToLeo(item,ev.currentTarget);e.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{item.grade=b.dataset.g;saveLocal();render()});e.querySelector('.toggle').onclick=()=>e.classList.toggle('open');const leoArea=e.querySelector('.leoRead');e.querySelector('.pasteLeo').onclick=ev=>pasteLeo(item,leoArea,ev.currentTarget);leoArea.oninput=ev=>{item.leoRead=ev.target.value;item.leoSavedAt=new Date().toISOString();saveFormalFromLeo(item);saveLocal()};e.querySelector('.check').onchange=ev=>{item.check=ev.target.value;saveLocal()};e.querySelector('.memo').oninput=ev=>{item.memo=ev.target.value;saveLocal()};e.querySelector('.danger').onclick=()=>{if(confirm('本当に削除する？')){logs=logs.filter(x=>x.id!==item.id);saveLocal();render()}};box.append(e)})}
document.getElementById('cast').onclick=()=>{const q=document.getElementById('q').value.trim();if(!q)return;const vals=Array.from({length:6},yao),b=hex(vals),ch=vals.map(v=>v===6?7:v===9?8:v),c=hex(ch),mv=vals.map((v,i)=>v===6||v===9?line(v,i):null).filter(Boolean),r=interp(q,b,c,mv);maxSeq++;logs.push({id:'L'+Date.now(),seq:maxSeq,date:TODAY(),q,raw:vals.join(', '),ben:`${b[0]} ${b[1]}`,move:mv.length?mv.join('・'):'なし',zhi:`${c[0]} ${c[1]}`,summary:r.summary,verdict:r.verdict,grade:'未判定',detail:r.detail,leoRead:'',formalVerdict:'',memo:'',check:''});saveLocal();document.getElementById('q').value='';selected=TODAY();viewY=new Date().getFullYear();viewM=new Date().getMonth()+1;render()};
document.getElementById('search').oninput=render;document.getElementById('pm').onclick=()=>{viewM--;if(viewM<1){viewM=12;viewY--}selected=`${viewY}-${String(viewM).padStart(2,'0')}-01`;render()};document.getElementById('nm').onclick=()=>{viewM++;if(viewM>12){viewM=1;viewY++}selected=`${viewY}-${String(viewM).padStart(2,'0')}-01`;render()};document.getElementById('today').onclick=()=>{const d=new Date();viewY=d.getFullYear();viewM=d.getMonth()+1;selected=TODAY();render()};
function updateBackupHelp(){const status=document.getElementById('backupStatus');status.textContent=window.showSaveFilePicker?'保存時に保存先を選べます。iCloud Driveも選択できます。':'Firefoxなどではブラウザの保存設定を使います。「ファイルごとに保存先を指定」を有効にすると、保存時にiCloud Driveを選べます。'}
async function saveBackup(){const now=new Date(),stamp=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0')+String(now.getSeconds()).padStart(2,'0'),name=`占い台帳_${stamp}.json`,text=JSON.stringify({version:4,createdAt:now.toISOString(),maxSeq,logs},null,2),status=document.getElementById('backupStatus');if(window.showSaveFilePicker){try{const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'JSON',accept:{'application/json':['.json']}}]});const w=await h.createWritable();await w.write(text);await w.close();status.textContent=`保存完了：${h.name}（${logs.length}件）`;return}catch(e){if(e&&e.name==='AbortError'){status.textContent='保存をキャンセルした';return}}}const blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent=`バックアップのダウンロードを開始した（${logs.length}件）。FirefoxでiCloud Driveへ保存する場合は、保存先を毎回確認する設定にしてiCloud Driveを選んでください。`}
document.getElementById('backup').onclick=saveBackup;
document.getElementById('restoreBtn').onclick=()=>document.getElementById('restoreFile').click();document.getElementById('restoreFile').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.logs))throw new Error();if(confirm(`バックアップ ${data.logs.length}件で現在の台帳を置き換える？`)){logs=data.logs;maxSeq=Number(data.maxSeq||0);for(const x of logs){if(Number(x.seq)>maxSeq)maxSeq=Number(x.seq)}for(const x of logs){if(!x.seq){maxSeq++;x.seq=maxSeq}}saveLocal();render();document.getElementById('backupStatus').textContent=`復元完了：${f.name}`}}catch(e){alert('台帳バックアップとして読めませんでした')}ev.target.value=''};
updateBackupHelp();saveLocal();render();
</script>
