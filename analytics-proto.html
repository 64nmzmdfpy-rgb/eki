<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>占い台帳・抽出試作</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}body{margin:0;background:#f5f5f7;color:#111}main{max-width:760px;margin:auto;padding:16px}.panel,.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}.row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid rgba(127,127,127,.2)}.chip{display:inline-block;border:1px solid #bbb;border-radius:999px;padding:4px 8px;margin:3px;font-size:12px}.muted{opacity:.7}.small{font-size:13px}.q{font-weight:700}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.panel,.card{background:#1c1c1e;border-color:#38383a}.chip{border-color:#555}}</style></head><body><main><section class="panel"><b>自動抽出・試作</b><p class="muted small">公開コードに質問内容や固有語辞書は保存しません。端末内ログだけから候補を生成します。</p><div id="status" class="small"></div></section><section class="panel"><b>固有名詞らしき語 TOP20</b><div id="people"></div></section><section class="panel"><b>頻出語句 TOP20</b><p class="muted small">2〜8文字の連続語句を端末内で集計します。</p><div id="topics"></div></section><section class="panel"><b>最新30件の抽出確認</b><div id="samples"></div></section><p><a href="search-all.html">← 全期間検索へ戻る</a></p></main><script>const KEY='uranai-ledger-v1';let logs=[];try{logs=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const norm=s=>String(s||'').normalize('NFKC').replace(/[\s　]+/g,' ').trim();const punct=/[。、！？!?.,：:；;「」『』（）()【】\[\]<>＜＞]/g;const particle=/(について|に対して|として|から|より|まで|なら|ので|のに|って|とは|では|には|へは|を|に|へ|と|が|は|も|の|で|や|か)/g;function chunks(q){return norm(q).replace(punct,' ').split(/\s+/).flatMap(x=>x.split(particle)).map(norm).filter(x=>x&&x.length>=2&&!particle.test(x)).filter(x=>{particle.lastIndex=0;return true})}function proper(q){const out=[];for(const c of chunks(q)){for(const m of c.matchAll(/[一-龯々ヶヵ]{3,8}/g))out.push(m[0])}return [...new Set(out)]}function ngrams(q){const out=new Set();for(const c of chunks(q)){const s=c.replace(/[^一-龯々ヶヵぁ-んァ-ヶーA-Za-z0-9％%]/g,'');for(let n=2;n<=Math.min(8,s.length);n++){for(let i=0;i+n<=s.length;i++){const g=s.slice(i,i+n);if(!/^\d+$/.test(g))out.add(g)}}}return [...out]}function rank(map,target){const arr=[...map].map(([name,n])=>({name,n})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n||b.name.length-a.name.length||a.name.localeCompare(b.name,'ja')).slice(0,20);document.getElementById(target).innerHTML=arr.length?arr.map((x,i)=>`<div class="row"><b>${i+1}</b><span>${esc(x.name)}</span><b>${x.n}件</b></div>`).join(''):'2件以上の候補なし'}function render(){const pc=new Map(),tc=new Map();for(const x of logs){for(const v of proper(x.q))pc.set(v,(pc.get(v)||0)+1);for(const v of ngrams(x.q))tc.set(v,(tc.get(v)||0)+1)}rank(pc,'people');rank(tc,'topics');document.getElementById('status').textContent=`全${logs.length}件を端末内で集計`;const recent=[...logs].sort((a,b)=>Number(b.seq||0)-Number(a.seq||0)).slice(0,30);document.getElementById('samples').innerHTML=recent.map(x=>{const ps=proper(x.q),ts=ngrams(x.q).filter(v=>v.length>=3).slice(0,12);return `<div class="card"><div class="q">#${esc(x.seq||'?')} ${esc(x.q||'')}</div><div>${ps.map(v=>`<span class="chip">${esc(v)}</span>`).join('')||'<span class="muted small">固有名詞候補なし</span>'}</div><div>${ts.map(v=>`<span class="chip">${esc(v)}</span>`).join('')}</div></div>`}).join('')}render();</script></body></html>
