<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>占い台帳・本番メタデータ試作</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}body{margin:0;background:#f5f5f7;color:#111}main{max-width:860px;margin:auto;padding:16px}.panel,.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}textarea,input,select,button{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;font-size:15px}button{cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.small{font-size:13px}.muted{opacity:.7}.q{font-weight:700;margin-bottom:10px}.chip{display:inline-block;border:1px solid #bbb;border-radius:999px;padding:4px 8px;margin:2px;font-size:12px}.danger{font-weight:700}.ok{font-weight:700}@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.panel,.card{background:#1c1c1e;border-color:#38383a}textarea,input,select,button{background:#111;color:#fff;border-color:#444}.chip{border-color:#555}}</style></head><body><main><section class="panel"><b>本番ログへメタデータを保存</b><p class="small muted">公開コードは器だけ。人物名・作品名・テーマ・指標・除外語・別名の中身は、このブラウザにだけ保存します。本番反映の直前に自動バックアップを作成します。</p><div id="status" class="small"></div><div id="backupStatus" class="small ok" style="margin-top:6px"></div></section><section class="panel"><b>ローカル辞書</b><div class="grid3"><select id="kind"><option value="person">人物</option><option value="work">作品</option><option value="topic">テーマ</option><option value="metric">指標</option><option value="ignore">除外語</option></select><input id="canonical" placeholder="代表名"><input id="aliases" placeholder="別名（カンマ区切り）"></div><button id="add" style="margin-top:8px">辞書へ追加</button><div id="dict" style="margin-top:10px"></div></section><section class="panel"><b>本番反映</b><p class="small muted">本番ログ各件に <code>entities</code> を追加します。質問文・卦・判定など既存項目は変更しません。</p><button id="apply" class="danger">バックアップして本番107件へ反映</button><div class="grid" style="margin-top:8px"><button id="download">現在の本番JSONを保存</button><button id="restore">直前バックアップから戻す</button></div></section><section class="panel"><b>検索テスト</b><input id="query" placeholder="質問を入力"><button id="search" style="margin-top:8px">関連ログを探す</button><div id="results" style="margin-top:10px"></div></section><section class="panel"><b>最新30件</b><div id="cards"></div></section><p><a href="search-all.html">← 全期間検索へ戻る</a></p></main><script>const LOGKEY='uranai-ledger-v1',DICTKEY='uranai-ledger-dict-v1',LASTBACKUP='uranai-ledger-backup-before-meta-v1',BACKUPINDEX='uranai-ledger-backup-index-v1';let logs=[];try{logs=JSON.parse(localStorage.getItem(LOGKEY))||[]}catch(e){}let dict=[];try{dict=JSON.parse(localStorage.getItem(DICTKEY))||[]}catch(e){}const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const norm=s=>String(s||'').normalize('NFKC').trim();const saveDict=()=>localStorage.setItem(DICTKEY,JSON.stringify(dict));function aliasesOf(d){return [...new Set([norm(d.canonical),...(d.aliases||[]).map(norm)].filter(Boolean))]}function emptyEntities(){return {person:[],work:[],topic:[],metric:[]}}function derive(q){const e=emptyEntities(),text=norm(q);for(const d of dict){if(d.kind==='ignore')continue;if(!e[d.kind])continue;if(aliasesOf(d).some(a=>text.includes(a))&&!e[d.kind].includes(d.canonical))e[d.kind].push(d.canonical)}return e}function timestamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`}function downloadText(name,text){const blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}function makeBackup(){const raw=localStorage.getItem(LOGKEY)||'[]',stamp=timestamp(),key=`uranai-ledger-backup-${stamp}`;localStorage.setItem(LASTBACKUP,raw);localStorage.setItem(key,raw);let idx=[];try{idx=JSON.parse(localStorage.getItem(BACKUPINDEX))||[]}catch(e){}idx.unshift({key,createdAt:new Date().toISOString(),count:logs.length});idx=idx.slice(0,10);localStorage.setItem(BACKUPINDEX,JSON.stringify(idx));downloadText(`uranai-ledger-before-meta-${stamp}.json`,raw);return key}function applyAll(){const key=makeBackup();logs=logs.map(x=>({...x,entities:derive(x.q)}));localStorage.setItem(LOGKEY,JSON.stringify(logs));document.getElementById('backupStatus').textContent=`バックアップ作成済み: ${key} ／ 本番へ反映済み`;render()}function restoreLast(){const raw=localStorage.getItem(LASTBACKUP);if(!raw){document.getElementById('backupStatus').textContent='直前バックアップがありません';return}if(!confirm('本番ログを直前バックアップの内容へ戻します。'))return;localStorage.setItem(LOGKEY,raw);try{logs=JSON.parse(raw)||[]}catch(e){logs=[]}document.getElementById('backupStatus').textContent='直前バックアップから復元しました';render()}function chips(arr){return (arr||[]).map(v=>`<span class="chip">${esc(v)}</span>`).join('')}function renderDict(){document.getElementById('dict').innerHTML=dict.length?dict.map((d,i)=>`<div class="card"><b>${esc(d.kind)}</b> ${esc(d.canonical)}<div class="small muted">${esc((d.aliases||[]).join(', '))}</div><button data-del="${i}" style="margin-top:6px">削除</button></div>`).join(''):'<span class="muted small">辞書はまだ空です</span>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{dict.splice(Number(b.dataset.del),1);saveDict();render()})}function renderCards(){const recent=[...logs].sort((a,b)=>Number(b.seq||0)-Number(a.seq||0)).slice(0,30);document.getElementById('cards').innerHTML=recent.map(x=>{const e=x.entities||{};return `<div class="card"><div class="q">#${esc(x.seq||'?')} ${esc(x.q||'')}</div><div class="small"><b>人物</b>${chips(e.person)}<br><b>作品</b>${chips(e.work)}<br><b>テーマ</b>${chips(e.topic)}<br><b>指標</b>${chips(e.metric)}</div></div>`}).join('')}function search(){const q=norm(document.getElementById('query').value);if(!q){document.getElementById('results').innerHTML='';return}const wanted=derive(q);const ranked=logs.map(x=>{const e=x.entities||{},hits=[];let score=0;for(const k of Object.keys(wanted))for(const v of wanted[k])if((e[k]||[]).includes(v)){hits.push(v);score+=k==='person'||k==='work'?4:2}return {x,score,hits}}).filter(r=>r.score>0).sort((a,b)=>b.score-a.score||Number(b.x.seq||0)-Number(a.x.seq||0)).slice(0,50);document.getElementById('results').innerHTML=ranked.length?ranked.map(r=>`<div class="card"><b>#${esc(r.x.seq)} ${esc(r.x.q)}</b><div class="small muted">一致: ${esc(r.hits.join('・'))} ／ ${r.score}点</div></div>`).join(''):'<span class="muted small">辞書に一致する関連ログなし</span>'}function render(){const tagged=logs.filter(x=>x.entities).length;document.getElementById('status').textContent=`ログ ${logs.length}件 ／ 辞書 ${dict.length}件 ／ 本番タグ済み ${tagged}件`;renderDict();renderCards()}document.getElementById('add').onclick=()=>{const kind=document.getElementById('kind').value,canonical=norm(document.getElementById('canonical').value),aliases=document.getElementById('aliases').value.split(/[、,，]/).map(norm).filter(Boolean);if(!canonical)return;dict.push({kind,canonical,aliases});document.getElementById('canonical').value='';document.getElementById('aliases').value='';saveDict();render()};document.getElementById('apply').onclick=applyAll;document.getElementById('restore').onclick=restoreLast;document.getElementById('download').onclick=()=>downloadText(`uranai-ledger-current-${timestamp()}.json`,localStorage.getItem(LOGKEY)||'[]');document.getElementById('search').onclick=search;render();</script></body></html>
