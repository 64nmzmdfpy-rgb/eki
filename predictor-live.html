<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prospective Prediction Log</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111}main{max-width:980px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:12px}h1{margin:0 0 8px;font-size:22px}h2{font-size:17px}.muted{opacity:.65}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select,textarea,button{font:inherit;border:1px solid #bbb;border-radius:10px;padding:10px;background:#fff;color:inherit}textarea{width:100%}button{cursor:pointer;font-weight:700}.row{border-top:1px solid #ddd;padding:12px 0}.row:first-child{border-top:0}.meta{font-size:12px;opacity:.68}.pill{display:inline-block;border:1px solid #bbb;border-radius:999px;padding:2px 7px;margin:2px;font-size:12px}.yes{font-weight:800}.no{font-weight:800}.unresolved{opacity:.65}a{color:inherit;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}th,td{border-bottom:1px solid #ddd;padding:7px;text-align:right}th:first-child,td:first-child{text-align:left}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.panel,input,select,textarea,button{background:#1c1c1e;border-color:#444;color:#fff}.row,th,td{border-color:#444}}</style></head><body><main>
<section class="panel"><h1>前向き予測ログ</h1><div class="muted">予測を先に固定し、結果が判明した後で正解だけ追加します。質問文と予測データはこのブラウザの localStorage にだけ保存し、GitHubには送信しません。</div><div style="margin-top:10px"><a href="predictor-lab.html">← Prediction Lab</a></div></section>
<section class="panel"><h2>1. 新しい予測を固定</h2><textarea id="question" rows="3" placeholder="質問"></textarea><div class="grid" style="margin-top:10px"><label>レオ判定<select id="leo"><option>YES</option><option>NO</option></select></label><label>レオ確信度<select id="conf"><option>低</option><option selected>中</option><option>高</option></select></label><label>易判定<select id="iching"><option value="">なし</option><option>YES</option><option>NO</option></select></label><label>事前確率<input id="base" type="number" min="0" max="1" step="0.01" placeholder="0.50"></label><label>分野<input id="domain" placeholder="芸能 / 株 / スポーツ等"></label><label>時間軸<select id="horizon"><option>短期</option><option selected>中期</option><option>長期</option></select></label><label>解決予定日<input id="due" type="date"></label></div><button id="save" style="margin-top:10px">予測を固定保存</button><div id="msg" class="small muted" style="margin-top:8px"></div></section>
<section class="panel"><h2>2. 通算成績</h2><div id="stats"></div></section>
<section class="panel"><h2>3. 予測一覧・答え合わせ</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="exportJson">JSONを書き出す</button><button id="exportCsv">CSVを書き出す</button></div><div id="list" style="margin-top:8px"></div></section>
<script>
const KEY='predlab-live-v1',$=id=>document.getElementById(id);
function read(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}}
function write(a){localStorage.setItem(KEY,JSON.stringify(a))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function y(v){return String(v).toUpperCase()==='YES'?1:String(v).toUpperCase()==='NO'?0:NaN}
function calc(field){const a=read().filter(x=>x.outcome==='YES'||x.outcome==='NO').filter(x=>x[field]==='YES'||x[field]==='NO');let tp=0,tn=0,fp=0,fn=0;for(const x of a){const p=y(x[field]),z=y(x.outcome);if(p&&z)tp++;else if(!p&&!z)tn++;else if(p&&!z)fp++;else fn++}const tpr=tp+fn?tp/(tp+fn):NaN,tnr=tn+fp?tn/(tn+fp):NaN,bacc=Number.isFinite(tpr)&&Number.isFinite(tnr)?(tpr+tnr)/2:NaN,acc=a.length?(tp+tn)/a.length:NaN;return{n:a.length,bacc,acc,tpr,tnr,tp,tn,fp,fn}}
function pct(v){return Number.isFinite(v)?(v*100).toFixed(1)+'%':'—'}
function renderStats(){const a=read(),resolved=a.filter(x=>x.outcome).length,leo=calc('leo_pred'),ich=calc('iching_pred');$('stats').innerHTML=`<div class="small muted">総予測 ${a.length}件 / 解決済み ${resolved}件 / 未解決 ${a.length-resolved}件</div><table><thead><tr><th>方式</th><th>n</th><th>BAcc</th><th>Accuracy</th><th>YES再現</th><th>NO再現</th></tr></thead><tbody><tr><td>レオ読み</td><td>${leo.n}</td><td>${pct(leo.bacc)}</td><td>${pct(leo.acc)}</td><td>${pct(leo.tpr)}</td><td>${pct(leo.tnr)}</td></tr><tr><td>易</td><td>${ich.n}</td><td>${pct(ich.bacc)}</td><td>${pct(ich.acc)}</td><td>${pct(ich.tpr)}</td><td>${pct(ich.tnr)}</td></tr></tbody></table>`}
function renderList(){const a=read().slice().reverse();$('list').innerHTML=a.length?a.map(x=>`<div class="row"><div><b>#${x.id}</b> ${esc(x.question)}</div><div class="meta">固定 ${new Date(x.created_at).toLocaleString()} ${x.due?'/ 解決予定 '+esc(x.due):''}</div><div><span class="pill">レオ ${x.leo_pred}</span><span class="pill">確信度 ${x.leo_conf}</span>${x.iching_pred?`<span class="pill">易 ${x.iching_pred}</span>`:''}${x.base_rate!==null?`<span class="pill">事前 ${(x.base_rate*100).toFixed(0)}%</span>`:''}${x.domain?`<span class="pill">${esc(x.domain)}</span>`:''}<span class="pill">${x.horizon}</span></div>${x.outcome?`<div style="margin-top:7px"><b>正解：${x.outcome}</b> <span class="meta">${new Date(x.resolved_at).toLocaleString()}</span></div>`:`<div class="unresolved" style="margin-top:8px">未解決 <button onclick="resolve(${x.id},'YES')">正解 YES</button> <button onclick="resolve(${x.id},'NO')">正解 NO</button></div>`}</div>`).join(''):'<div class="muted small">まだ予測なし。</div>'}
function render(){renderStats();renderList()}
$('save').onclick=()=>{const q=$('question').value.trim();if(!q){$('msg').textContent='質問を入れてください。';return}const br=$('base').value===''?null:Number($('base').value);if(br!==null&&(!Number.isFinite(br)||br<0||br>1)){$('msg').textContent='事前確率は0〜1。';return}const a=read(),id=(a.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1);a.push({id,question:q,leo_pred:$('leo').value,leo_conf:$('conf').value,iching_pred:$('iching').value||null,base_rate:br,domain:$('domain').value.trim(),horizon:$('horizon').value,due:$('due').value||null,created_at:new Date().toISOString(),outcome:null,resolved_at:null});write(a);$('question').value='';$('msg').textContent=`#${id} を固定保存。予測部分は答え合わせ時に変更しません。`;render()};
window.resolve=(id,outcome)=>{const a=read(),x=a.find(z=>z.id===id);if(!x||x.outcome)return;x.outcome=outcome;x.resolved_at=new Date().toISOString();write(a);render()};
function download(name,text,type){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('exportJson').onclick=()=>download('prospective-predictions.json',JSON.stringify(read(),null,2),'application/json');
$('exportCsv').onclick=()=>{const a=read(),cols=['id','created_at','due','question','leo_pred','leo_conf','iching_pred','base_rate','domain','horizon','outcome','resolved_at'],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',s=[cols.join(','),...a.map(r=>cols.map(c=>q(r[c])).join(','))].join('\n');download('prospective-predictions.csv',s,'text/csv')};
render();
</script></main></body></html>
