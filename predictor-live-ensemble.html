<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adaptive Prediction Ensemble</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111}main{max-width:920px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:12px}h1{margin:0 0 8px;font-size:22px}h2{font-size:17px}.muted{opacity:.66}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}input,select,textarea,button{font:inherit;border:1px solid #bbb;border-radius:10px;padding:10px;background:#fff;color:inherit}textarea{width:100%}button{cursor:pointer;font-weight:800}.metric{font-size:30px;font-weight:900;margin:8px 0}.pill{display:inline-block;border:1px solid #bbb;border-radius:999px;padding:3px 8px;margin:2px;font-size:12px}a{color:inherit;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}th,td{border-bottom:1px solid #ddd;padding:7px;text-align:right}th:first-child,td:first-child{text-align:left}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.panel,input,select,textarea,button{background:#1c1c1e;border-color:#444;color:#fff}th,td{border-color:#444}}</style></head><body><main>
<section class="panel"><h1>適応アンサンブル</h1><div class="muted">前向き予測ログの解決済み成績だけから、レオ読み・易・凍結モデル・事前確率の重みを更新します。十分な件数があるときだけ階層別重みと、信号同士の一致実績による小さな相乗補正を使います。</div><div style="margin-top:10px"><a href="predictor-live.html">← 前向き予測ログ</a>　<a href="predictor-live-rank.html">勝ち残り判定</a></div></section>
<section class="panel"><h2>現在の全体重み</h2><div id="weights"></div></section>
<section class="panel"><h2>次の1件を合成</h2><textarea id="question" rows="3" placeholder="質問"></textarea><div class="grid" style="margin-top:10px"><label>レオ判定<select id="leo"><option>YES</option><option>NO</option></select></label><label>レオ確信度<select id="conf"><option>低</option><option selected>中</option><option>高</option></select></label><label>易判定<select id="ich"><option value="">なし</option><option>YES</option><option>NO</option></select></label><label>事前確率<input id="base" type="number" min="0" max="1" step="0.01" placeholder="0.50"></label><label>分野<input id="domain" placeholder="芸能 / 株 / スポーツ等"></label><label>時間軸<select id="horizon"><option>短期</option><option selected>中期</option><option>長期</option></select></label><label>解決予定日<input id="due" type="date"></label></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button id="go">合成判定</button><button id="save" disabled>この合成予測を前向きログに固定</button></div><div id="out"></div><div id="msg" class="small muted" style="margin-top:8px"></div></section>
<script>
const KEY='predlab-live-v1',MKEY='predlab-frozen-model-v1',$=id=>document.getElementById(id),names={leo_pred:'レオ読み',iching_pred:'易',model_pred:'凍結モデル',base_pred:'事前確率'};let last=null;
function read(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}}function write(a){localStorage.setItem(KEY,JSON.stringify(a))}function model(){try{return JSON.parse(localStorage.getItem(MKEY)||'null')}catch{return null}}function y(v){return v==='YES'?1:v==='NO'?0:NaN}function yn(v){const z=y(v);return Number.isFinite(z)?(z?1:-1):NaN}function conf(v){return v==='高'?3:v==='中'?2:v==='低'?1:Number(v)}function hz(v){return v==='短期'?1:v==='中期'?2:v==='長期'?3:Number(v)}function sig(v){return v>35?1:v<-35?0:1/(1+Math.exp(-v))}
function filtered(domain='',horizon=''){const d=String(domain||'').trim(),h=String(horizon||'').trim();return read().filter(x=>(!d||String(x.domain||'').trim()===d)&&(!h||String(x.horizon||'').trim()===h))}
function calc(field,domain='',horizon=''){const a=filtered(domain,horizon).filter(x=>(x.outcome==='YES'||x.outcome==='NO')&&(x[field]==='YES'||x[field]==='NO'));let tp=0,tn=0,fp=0,fn=0;for(const x of a){const p=y(x[field]),z=y(x.outcome);if(p&&z)tp++;else if(!p&&!z)tn++;else if(p&&!z)fp++;else fn++}const yesN=tp+fn,noN=tn+fp,tpr=yesN?tp/yesN:NaN,tnr=noN?tn/noN:NaN,bacc=Number.isFinite(tpr)&&Number.isFinite(tnr)?(tpr+tnr)/2:NaN;return{field,n:a.length,yesN,noN,bacc}}
function perfWeight(r){if(!Number.isFinite(r.bacc)||r.yesN<3||r.noN<3)return 1;const shrink=r.n/(r.n+30),shrunk=.5+shrink*(r.bacc-.5);return Math.max(.25,Math.min(1.75,shrunk/.5))}
function scopeCounts(domain='',horizon=''){const a=filtered(domain,horizon).filter(x=>x.outcome==='YES'||x.outcome==='NO');return{n:a.length,yes:a.filter(x=>x.outcome==='YES').length,no:a.filter(x=>x.outcome==='NO').length}}
function eligible(c,n,y0,n0){return c.n>=n&&c.yes>=y0&&c.no>=n0}
function chooseScope(domain='',horizon=''){const d=String(domain||'').trim(),h=String(horizon||'').trim();if(d&&h){const c=scopeCounts(d,h);if(eligible(c,16,5,5))return{domain:d,horizon:h,label:`${d} × ${h}`,level:'分野×時間軸'}}if(d){const c=scopeCounts(d,'');if(eligible(c,12,4,4))return{domain:d,horizon:'',label:d,level:'分野'}}if(h){const c=scopeCounts('',h);if(eligible(c,12,4,4))return{domain:'',horizon:h,label:h,level:'時間軸'}}return{domain:'',horizon:'',label:'全体',level:'全体'}}
function weights(domain='',horizon=''){const scope=chooseScope(domain,horizon),rs=Object.keys(names).map(k=>calc(k,scope.domain,scope.horizon)),raw=rs.map(r=>({...r,w:perfWeight(r)})),sum=raw.reduce((s,r)=>s+r.w,0)||1;return{scope,items:raw.map(r=>({...r,norm:r.w/sum}))}}
function pairBoost(a,b,scope){const rows=filtered(scope.domain,scope.horizon).filter(x=>(x.outcome==='YES'||x.outcome==='NO')&&(x[a]==='YES'||x[a]==='NO')&&x[a]===x[b]);if(rows.length<12)return null;const yesN=rows.filter(x=>x.outcome==='YES').length,noN=rows.filter(x=>x.outcome==='NO').length;if(yesN<4||noN<4)return null;let tp=0,tn=0,fp=0,fn=0;for(const x of rows){const p=y(x[a]),z=y(x.outcome);if(p&&z)tp++;else if(!p&&!z)tn++;else if(p&&!z)fp++;else fn++}const tpr=tp/(tp+fn),tnr=tn/(tn+fp),bacc=(tpr+tnr)/2,shrink=rows.length/(rows.length+30),adj=Math.max(.8,Math.min(1.2,1+shrink*(bacc-.5)));return{a,b,n:rows.length,bacc,adj}}
function interactionBoosts(signals,scope){const ks=Object.keys(signals).filter(k=>signals[k]==='YES'||signals[k]==='NO'),out=[];for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++)if(signals[ks[i]]===signals[ks[j]]){const z=pairBoost(ks[i],ks[j],scope);if(z)out.push(z)}return out}
function enc(r,sp){return sp.map(s=>s.type==='yn'?yn(r[s.k]):s.type==='conf'?conf(r[s.k]):s.type==='horizon'?hz(r[s.k]):s.type==='cat'?(String(r[s.k]??'').trim()===s.cat?1:0):Number(r[s.k]))}
function frozenPred(r){const m=model();if(!m)return null;const x=enc(r,m.spec||[]);if(x.some(v=>!Number.isFinite(v)))return null;const z=x.map((v,j)=>(v-m.s.mu[j])/m.s.sd[j]);let q=m.w[0];for(let j=0;j<z.length;j++)q+=m.w[j+1]*z[j];const p=sig(q);return{pred:p>=m.th?'YES':'NO',prob:p,name:m.name,frozen_at:m.frozen_at,datasetId:m.datasetId}}
function basePred(br){if(!Number.isFinite(br)||br<0||br>1||Math.abs(br-.5)<.01)return null;return{pred:br>.5?'YES':'NO',prob:br}}
function pct(v){return Number.isFinite(v)?(v*100).toFixed(1)+'%':'—'}
function renderWeights(){const pack=weights(),ws=pack.items;$('weights').innerHTML=`<table><thead><tr><th>方式</th><th>前向きn</th><th>BAcc</th><th>縮小後の相対力</th><th>合成重み</th></tr></thead><tbody>${ws.map(r=>`<tr><td>${names[r.field]}</td><td>${r.n}</td><td>${pct(r.bacc)}</td><td>${r.w.toFixed(3)}</td><td>${pct(r.norm)}</td></tr>`).join('')}</tbody></table><div class="small muted" style="margin-top:8px">一致相乗補正は、同じ2信号が同方向だった解決済み12件以上＋実際YES/NO各4件以上でのみ使用し、補正幅は最大±20%。</div>`}
$('go').onclick=()=>{const q=$('question').value.trim(),br=$('base').value===''?null:Number($('base').value);if(br!==null&&(!Number.isFinite(br)||br<0||br>1)){ $('out').innerHTML='<div class="muted" style="margin-top:10px">事前確率は0〜1で入力してください。</div>';return}const row={leo_pred:$('leo').value,leo_conf:$('conf').value,iching_pred:$('ich').value||null,base_rate:br,domain:$('domain').value.trim(),horizon:$('horizon').value},fp=frozenPred(row),bp=basePred(br),pack=weights(row.domain,row.horizon),ws=pack.items,signals={leo_pred:row.leo_pred,iching_pred:row.iching_pred,model_pred:fp?fp.pred:null,base_pred:bp?bp.pred:null},boosts=interactionBoosts(signals,pack.scope);let num=0,den=0,parts=[],used=[];for(const r of ws){const s=signals[r.field];if(s!=='YES'&&s!=='NO')continue;let strength=1;if(r.field==='leo_pred')strength={低:.65,中:.82,高:1}[row.leo_conf]||.82;if(r.field==='model_pred'&&fp)strength=.65+.7*Math.abs(fp.prob-.5);if(r.field==='base_pred'&&bp)strength=.35+1.3*Math.min(1,Math.abs(bp.prob-.5)*2);let synergy=1;for(const b of boosts)if(b.a===r.field||b.b===r.field)synergy*=Math.sqrt(b.adj);synergy=Math.max(.85,Math.min(1.15,synergy));const v=s==='YES'?1:-1,w=r.w*strength*synergy;num+=v*w;den+=w;parts.push(`${names[r.field]} ${s} × ${w.toFixed(2)}`);used.push({field:r.field,pred:s,weight:w,base_weight:r.w,synergy})}if(!den){$('out').innerHTML='<div class="muted" style="margin-top:10px">使える信号がありません。</div>';last=null;$('save').disabled=true;return}const score=num/den,pseudo=.5+.5*score,pred=score>=0?'YES':'NO';last={question:q,row,fp,bp,ws,used,boosts,score,pseudo,pred,due:$('due').value||null,created_at:new Date().toISOString(),weight_scope:pack.scope.label,weight_level:pack.scope.level};$('save').disabled=!q;const boostHtml=boosts.length?`<div class="small" style="margin-top:6px">相乗補正：${boosts.map(b=>`${names[b.a]}＋${names[b.b]} n=${b.n} BAcc=${pct(b.bacc)} ×${b.adj.toFixed(2)}`).join(' / ')}</div>`:'';$('out').innerHTML=`<div class="metric">${pred}</div><div>合成スコア ${(score*100).toFixed(1)} / YES寄り指数 ${(pseudo*100).toFixed(1)}%</div><div class="small" style="margin-top:4px">重み：<b>${pack.scope.label}</b>（${pack.scope.level}）</div><div style="margin-top:6px">${parts.map(x=>`<span class="pill">${x}</span>`).join('')}</div>${boostHtml}<div class="small muted" style="margin-top:8px">YES寄り指数は校正済み確率ではありません。前向き成績に基づく重み付き方向スコアです。</div>`};
$('save').onclick=()=>{if(!last||!last.question)return;const a=read(),id=a.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1,x={id,question:last.question,leo_pred:last.row.leo_pred,leo_conf:last.row.leo_conf,iching_pred:last.row.iching_pred,base_rate:last.row.base_rate,base_pred:last.bp?last.bp.pred:null,domain:last.row.domain,horizon:last.row.horizon,due:last.due,created_at:new Date().toISOString(),model_pred:last.fp?last.fp.pred:null,model_prob:last.fp?last.fp.prob:null,model_name:last.fp?last.fp.name:null,model_frozen_at:last.fp?last.fp.frozen_at:null,model_dataset_id:last.fp?last.fp.datasetId:null,ensemble_pred:last.pred,ensemble_score:last.score,ensemble_yes_index:last.pseudo,ensemble_weights:last.used,ensemble_interactions:last.boosts,ensemble_weight_scope:last.weight_scope,ensemble_weight_level:last.weight_level,outcome:null,resolved_at:null};a.push(x);write(a);$('msg').textContent=`#${id} を前向きログに固定 / アンサンブル ${x.ensemble_pred} / ${x.ensemble_weight_scope}重み`;$('save').disabled=true;last=null;renderWeights()};
renderWeights();
</script></main></body></html>
