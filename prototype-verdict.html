<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>占い台帳・正式判定試作</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}body{margin:0;background:#f5f5f7;color:#111}main{max-width:760px;margin:auto;padding:16px}.card,.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}.muted{opacity:.7}.q{font-weight:700;font-size:18px;margin:6px 0}.simple{font-weight:700;margin-top:8px}.formal{font-size:20px;font-weight:800;margin:12px 0}.candidate{padding:10px;border:1px dashed #aaa;border-radius:12px;margin:10px 0}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{font-size:16px;padding:10px;border-radius:12px;border:1px solid #bbb;background:#fff;cursor:pointer}.active{outline:2px solid currentColor;font-weight:800}.num{font-size:13px;font-weight:700;opacity:.7}.ok{font-weight:800}.warn{font-weight:800}a{color:inherit}pre{white-space:pre-wrap;word-break:break-word}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.card,.panel{background:#1c1c1e;border-color:#38383a}button{background:#2c2c2e;color:#fff;border-color:#555}}</style></head><body><main><section class="panel"><b>正式判定・試作 v2</b><p class="muted">本番台帳と同じ端末内データを読みます。過去ログは保存済みの「レオの読み」から判定候補を拾います。候補は勝手に正式保存せず、確認してから保存します。</p><div id="summary"></div><p><a href="./">← 本番台帳へ戻る</a></p></section><div id="cards"></div></main><script>
const KEY='uranai-ledger-v1';let logs=[];try{logs=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(logs))}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function detectVerdict(text){const t=String(text||'').trim();if(!t)return{value:'',level:'要確認',reason:'レオの読みが未保存'};const lines=t.split(/\n+/).map(s=>s.trim()).filter(Boolean);for(let i=lines.length-1;i>=0;i--){let m=lines[i].match(/(?:最終判定|判定)\s*[：:]\s*(YES|NO|中立)\b/i);if(m)return{value:m[1].toUpperCase()==='YES'?'YES':m[1].toUpperCase()==='NO'?'NO':'中立',level:'確定形式',reason:lines[i]}}
const tail=lines.slice(-8).join(' ');const patterns=[['YES',/(?:結論|最終|判定)[^。]{0,20}(?:YES|Yes|yes|イエス)|(?:YES|Yes|yes)(?:寄り|方向|と判定)/],['NO',/(?:結論|最終|判定)[^。]{0,20}(?:NO|No|no|ノー)|(?:NO|No|no)(?:寄り|方向|と判定)/],['中立',/(?:結論|最終|判定)[^。]{0,20}中立|中立(?:判定|寄り|とする)/]];const hits=patterns.filter(([,r])=>r.test(tail));if(hits.length===1)return{value:hits[0][0],level:'推定',reason:'末尾付近の表現から推定'};return{value:'',level:'要確認',reason:hits.length>1?'YES/NO/中立の表現が混在':'判定表現を安全に特定できず'}}
function fixedPrompt(item){return `次の易占いを、質問そのものに即して詳しく読んでください。一般的な卦のキーワードを並べるだけではなく、この質問では本卦が何を意味するか、変爻が何を動かすか、之卦が最終的に何を示すかを自然な日本語で説明してください。最後は必ず独立した1行で「最終判定：YES」「最終判定：NO」「最終判定：中立」のいずれか1つだけを書いてください。返答はそのまま台帳へ貼って保存するので、JSONやコードブロックは不要です。\n\n通算番号：${item.seq||''}\n質問：${item.q||''}\n生データ（初爻→上爻）：${item.raw||''}\n本卦：${item.ben||''}\n変爻：${item.move||''}\n之卦：${item.zhi||''}`}
async function copyText(text,btn){try{await navigator.clipboard.writeText(text);btn.textContent='コピーした'}catch(e){btn.textContent='コピー失敗'}setTimeout(()=>btn.textContent='固定形式でレオに読ませる',1600)}
function render(){const box=document.getElementById('cards');box.innerHTML='';let detected=0,needs=0,formal=0;[...logs].sort((a,b)=>Number(b.seq||0)-Number(a.seq||0)).forEach(item=>{const d=detectVerdict(item.leoRead);if(item.formalVerdict)formal++;if(d.value)detected++;else needs++;const e=document.createElement('div');e.className='card';e.innerHTML=`<div class="num">通算 #${esc(item.seq||'')}</div><div class="q">${esc(item.q)}</div><div class="muted">${esc(item.ben)} ／ ${esc(item.move)} → ${esc(item.zhi)}</div><div class="simple">簡易判定：${esc(item.verdict||'未判定')}</div><div class="candidate">判定候補：<span class="${d.value?'ok':'warn'}">${esc(d.value||'要確認')}</span> <span class="muted">（${esc(d.level)}／${esc(d.reason)}）</span></div><div class="formal">正式判定：${esc(item.formalVerdict||'未設定')}</div>${d.value?`<button class="saveCandidate" style="width:100%;margin-bottom:8px">候補「${esc(d.value)}」を正式判定に保存</button>`:''}<div class="three">${['YES','NO','中立'].map(v=>`<button data-v="${v}" class="${item.formalVerdict===v?'active':''}">${v}</button>`).join('')}</div><button class="fixedPrompt" style="width:100%;margin-top:10px">固定形式でレオに読ませる</button><details style="margin-top:12px"><summary>レオの読みを見る</summary><pre>${esc(item.leoRead||'まだ保存されていません')}</pre></details>`;const sc=e.querySelector('.saveCandidate');if(sc)sc.onclick=()=>{item.formalVerdict=d.value;item.formalVerdictSource=d.level;item.formalVerdictSavedAt=new Date().toISOString();save();render()};e.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{item.formalVerdict=b.dataset.v;item.formalVerdictSource='手動確認';item.formalVerdictSavedAt=new Date().toISOString();save();render()});e.querySelector('.fixedPrompt').onclick=ev=>copyText(fixedPrompt(item),ev.currentTarget);box.append(e)});document.getElementById('summary').innerHTML=`<p><b>現在 ${logs.length}件</b> ／ 正式判定保存済み ${formal}件 ／ 候補抽出できる ${detected}件 ／ 要確認 ${needs}件</p><p class="muted">「推定」は必ず本文を見て確認してから保存。「確定形式」は末尾の固定行を直接読んでいます。</p>`}render();
</script></body></html>
