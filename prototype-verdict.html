<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>占い台帳・正式判定試作</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}body{margin:0;background:#f5f5f7;color:#111}main{max-width:760px;margin:auto;padding:16px}.card,.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}.muted{opacity:.7}.q{font-weight:700;font-size:18px;margin:6px 0}.simple{font-weight:700}.formal{font-size:20px;font-weight:800;margin:12px 0}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{font-size:16px;padding:10px;border-radius:12px;border:1px solid #bbb;background:#fff}.active{outline:2px solid currentColor;font-weight:800}.num{font-size:13px;font-weight:700;opacity:.7}a{color:inherit}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.card,.panel{background:#1c1c1e;border-color:#38383a}button{background:#2c2c2e;color:#fff;border-color:#555}}</style></head><body><main><section class="panel"><b>正式判定・試作</b><p class="muted">本番台帳と同じ端末内データを読みます。自動判定は「簡易判定」、レオの読みを見た後の結論は「正式判定」として別保存します。</p><p><a href="./">← 本番台帳へ戻る</a></p></section><div id="cards"></div></main><script>
const KEY='uranai-ledger-v1';let logs=[];try{logs=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(logs))}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function render(){const box=document.getElementById('cards');box.innerHTML='';[...logs].sort((a,b)=>Number(b.seq||0)-Number(a.seq||0)).forEach(item=>{const e=document.createElement('div');e.className='card';e.innerHTML=`<div class="num">通算 #${esc(item.seq||'')}</div><div class="q">${esc(item.q)}</div><div class="muted">${esc(item.ben)} ／ ${esc(item.move)} → ${esc(item.zhi)}</div><div class="simple">簡易判定：${esc(item.verdict||'未判定')}</div><div class="formal">正式判定：${esc(item.formalVerdict||'未設定')}</div><div class="three">${['YES','NO','中立'].map(v=>`<button data-v="${v}" class="${item.formalVerdict===v?'active':''}">${v}</button>`).join('')}</div><details style="margin-top:12px"><summary>レオの読みを見る</summary><div style="white-space:pre-wrap;margin-top:8px">${esc(item.leoRead||'まだ保存されていません')}</div></details>`;e.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{item.formalVerdict=b.dataset.v;item.formalVerdictSavedAt=new Date().toISOString();save();render()});box.append(e)})}render();
</script></body></html>
