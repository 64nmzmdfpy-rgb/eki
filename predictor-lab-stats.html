<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prediction Lab Stats</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111}main{max-width:980px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:12px}h1{margin:0 0 8px;font-size:22px}.muted{opacity:.65}.small{font-size:12px}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}th,td{border-bottom:1px solid #ddd;padding:8px 6px;text-align:right}th:first-child,td:first-child{text-align:left}.good{font-weight:800}.weak{opacity:.7}a{color:inherit}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.panel{background:#1c1c1e;border-color:#444}th,td{border-color:#444}}
</style></head><body><main>
<section class="panel"><h1>通算検証</h1><div class="muted">Prediction Lab の未見テスト履歴をこのブラウザから読み、方式ごとの通算成績・95%区間・ランダム予測との比較を表示します。</div><div style="margin-top:10px"><a href="predictor-lab.html">← Prediction Lab</a></div></section>
<section class="panel"><div id="out"></div></section>
<script>
const HKEY='predlab-history-v1',names={all:'全部入り',leo:'レオ読み',iching:'易だけ',semantic:'意味層'};
function readHistory(){try{const h=JSON.parse(localStorage.getItem(HKEY)||'[]');return Array.isArray(h)?h:[]}catch{return[]}}
function aggregate(){const agg={};for(const e of readHistory())for(const r of(e.results||[])){const a=agg[r.kind]||(agg[r.kind]={runs:0,tp:0,tn:0,fp:0,fn:0});a.runs++;a.tp+=r.tp||0;a.tn+=r.tn||0;a.fp+=r.fp||0;a.fn+=r.fn||0}return agg}
function seedFor(a,salt=0){return (a.tp*73856093+a.tn*19349663+a.fp*83492791+a.fn*2654435761+salt)>>>0}
function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function bootstrap(a,B=4000){const yesN=a.tp+a.fn,noN=a.tn+a.fp;if(yesN<2||noN<2)return[NaN,NaN];const y=[];for(let i=0;i<a.tp;i++)y.push(1);for(let i=0;i<a.fn;i++)y.push(0);const n=[];for(let i=0;i<a.tn;i++)n.push(1);for(let i=0;i<a.fp;i++)n.push(0);const r=rng(seedFor(a,12345)),vals=[];for(let b=0;b<B;b++){let sy=0,sn=0;for(let i=0;i<yesN;i++)sy+=y[Math.floor(r()*yesN)];for(let i=0;i<noN;i++)sn+=n[Math.floor(r()*noN)];vals.push((sy/yesN+sn/noN)/2)}vals.sort((x,y)=>x-y);return[vals[Math.floor(.025*(B-1))],vals[Math.floor(.975*(B-1))]]}
function nullP(a,B=12000){const yesN=a.tp+a.fn,noN=a.tn+a.fp;if(!yesN||!noN)return NaN;const obs=(a.tp/yesN+a.tn/noN)/2,r=rng(seedFor(a,987654)),ge=(()=>{let c=0;for(let b=0;b<B;b++){let cy=0,cn=0;for(let i=0;i<yesN;i++)if(r()<.5)cy++;for(let i=0;i<noN;i++)if(r()<.5)cn++;const z=(cy/yesN+cn/noN)/2;if(z>=obs-1e-12)c++}return c})();return(ge+1)/(B+1)}
function fmtP(p){if(!Number.isFinite(p))return'—';if(p<.001)return'<0.001';return p.toFixed(3)}
function render(){const agg=aggregate(),entries=Object.entries(agg);if(!entries.length){document.getElementById('out').innerHTML='<div class="muted">まだ未見テスト履歴なし。</div>';return}const rows=entries.map(([k,a])=>{const yesN=a.tp+a.fn,noN=a.tn+a.fp,total=yesN+noN,tpr=yesN?a.tp/yesN:NaN,tnr=noN?a.tn/noN:NaN,bacc=(tpr+tnr)/2,acc=total?(a.tp+a.tn)/total:NaN,[lo,hi]=bootstrap(a),p=nullP(a),sig=Number.isFinite(p)&&p<.05;return`<tr><td>${names[k]||k}</td><td>${a.runs}</td><td>${total}</td><td>${yesN}/${noN}</td><td class="${sig?'good':'weak'}">${(bacc*100).toFixed(1)}%</td><td>${Number.isFinite(lo)?(lo*100).toFixed(1)+'–'+(hi*100).toFixed(1)+'%':'—'}</td><td class="${sig?'good':'weak'}">${fmtP(p)}</td><td>${(acc*100).toFixed(1)}%</td><td>${(tpr*100).toFixed(1)}%</td><td>${(tnr*100).toFixed(1)}%</td></tr>`}).join('');document.getElementById('out').innerHTML=`<div class="small muted">帰無仮説は「YES/NOを各ケースで50%ランダムに予測」。p&lt;0.05なら、現在の通算BAcc以上が偶然だけで出る確率は5%未満です。これは未来予測能力の保証ではありません。</div><table><thead><tr><th>方式</th><th>未見セット</th><th>総n</th><th>YES/NO n</th><th>BAcc</th><th>95%区間</th><th>帰無p値</th><th>Accuracy</th><th>YES再現</th><th>NO再現</th></tr></thead><tbody>${rows}</tbody></table>`}
render();
</script></main></body></html>
