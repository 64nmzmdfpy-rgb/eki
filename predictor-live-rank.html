<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prediction Survivor Ranking</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111}main{max-width:900px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:12px}h1{margin:0 0 8px;font-size:22px}.muted{opacity:.66}.small{font-size:12px}a{color:inherit;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}th,td{border-bottom:1px solid #ddd;padding:8px 6px;text-align:right}th:first-child,td:first-child{text-align:left}.lead{font-weight:900}.keep{font-weight:800}.down{opacity:.7}.hold{opacity:.6}@media(prefers-color-scheme:dark){body{background:#111;color:#f5f5f7}.panel{background:#1c1c1e;border-color:#444}th,td{border-color:#444}}</style></head><body><main><section class="panel"><h1>勝ち残り判定</h1><div class="muted">前向き予測ログだけで、レオ読み・易・凍結モデルを比較します。過去データの成績は混ぜません。</div><div style="margin-top:10px"><a href="predictor-live.html">← 前向き予測ログ</a></div></section><section class="panel"><div id="out"></div></section><script>
const KEY='predlab-live-v1',names={leo_pred:'レオ読み',iching_pred:'易',model_pred:'凍結モデル'};
function read(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}}
function y(v){return v==='YES'?1:v==='NO'?0:NaN}
function calc(field){const a=read().filter(x=>(x.outcome==='YES'||x.outcome==='NO')&&(x[field]==='YES'||x[field]==='NO'));let tp=0,tn=0,fp=0,fn=0;for(const x of a){const p=y(x[field]),z=y(x.outcome);if(p&&z)tp++;else if(!p&&!z)tn++;else if(p&&!z)fp++;else fn++}const yesN=tp+fn,noN=tn+fp,tpr=yesN?tp/yesN:NaN,tnr=noN?tn/noN:NaN,bacc=Number.isFinite(tpr)&&Number.isFinite(tnr)?(tpr+tnr)/2:NaN,acc=a.length?(tp+tn)/a.length:NaN;return{field,n:a.length,yesN,noN,bacc,acc,tpr,tnr}}
function pct(v){return Number.isFinite(v)?(v*100).toFixed(1)+'%':'—'}
function render(){const rows=Object.keys(names).map(calc),eligible=rows.filter(r=>r.n>=10&&r.yesN>=3&&r.noN>=3&&Number.isFinite(r.bacc));let best=eligible.length?Math.max(...eligible.map(r=>r.bacc)):NaN;for(const r of rows){if(r.n<10||r.yesN<3||r.noN<3||!Number.isFinite(r.bacc)){r.status='保留';r.cl='hold';continue}const d=best-r.bacc;if(d<.000001){r.status='首位';r.cl='lead'}else if(d<=.05){r.status='残留';r.cl='keep'}else if(d>=.10){r.status='重み下げ候補';r.cl='down'}else{r.status='様子見';r.cl='hold'}}const total=read().length,res=read().filter(x=>x.outcome).length;document.getElementById('out').innerHTML=`<div class="small muted">総予測 ${total}件 / 解決済み ${res}件。最低10件かつYES/NO実例各3件までは順位を出しません。</div><table><thead><tr><th>方式</th><th>判定</th><th>n</th><th>YES/NO n</th><th>BAcc</th><th>Accuracy</th><th>YES再現</th><th>NO再現</th><th>首位差</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${names[r.field]}</td><td class="${r.cl}">${r.status}</td><td>${r.n}</td><td>${r.yesN}/${r.noN}</td><td>${pct(r.bacc)}</td><td>${pct(r.acc)}</td><td>${pct(r.tpr)}</td><td>${pct(r.tnr)}</td><td>${Number.isFinite(best)&&Number.isFinite(r.bacc)?((best-r.bacc)*100).toFixed(1)+'pt':'—'}</td></tr>`).join('')}</tbody></table><div class="small muted" style="margin-top:10px">暫定ルール：首位差5pt以内は残留、10pt以上なら重み下げ候補。件数が増えたら、このルール自体も未見結果を見ずに事前固定して厳しくします。</div>`}render();
</script></main></body></html>
